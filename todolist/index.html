      await pollStatus();
    } catch (e) {
      alert('Failed to send: ' + e.message);
      box.querySelectorAll('button').forEach(b => { b.disabled = false; });
    }
  }

  function turnNode(turn, taskId) {
    const el = document.createElement('div');
    if (turn.role === 'user') {
      el.className = 'turn user';
      // displayText (when the server attached one) is what you actually
      // typed - `text` is the full prompt sent to Claude, which on turn 0
      // also carries the injected Task/Notes/session-convention boilerplate.
      // Falls back to `text` for replies and turns from before this existed.
      el.textContent = turn.displayText != null ? turn.displayText : turn.text;
      if (turn.images && turn.images.length) {
        const wrap = document.createElement('div');
        wrap.className = 'turn-images';
        for (const name of turn.images) {
          const img = document.createElement('img');
          img.addEventListener('click', () => { if (img.src) window.open(img.src, '_blank'); });
          setImgSrc(img, name);
          wrap.appendChild(img);
        }
        el.appendChild(wrap);
      }
    } else {
      el.className = 'turn assistant';
      let html = '';
      if (turn.endstate && turn.endstate.length) {
        html += `<pre class="action-box">${escapeHtml(['ENDSTATE', ...turn.endstate.map(i => '- ' + i)].join('\n'))}</pre>`;
      }
      if (turn.doneEvidence && turn.doneEvidence.length) {
        html += `<pre class="action-box">${escapeHtml(['DONE EVIDENCE', ...turn.doneEvidence.map(i => '- ' + i)].join('\n'))}</pre>`;
      }
      if (turn.actionItems && turn.actionItems.length) {
        html += `<pre class="action-box">${escapeHtml(buildActionBox(turn.actionItems))}</pre>`;
      }
      if (turn.waiting) {
        html += `<pre class="action-box">${escapeHtml('⏳ WAITING\n' + turn.waiting)}</pre>`;
      }
      html += renderMarkdown(turn.text);
      if (turn.interrupted) html += `<div class="sub">_interrupted by you_</div>`;
      el.innerHTML = html;
      if (turn.options && turn.options.length) {
        const box = document.createElement('div');
        box.className = 'options-box';
        for (const opt of turn.options) {
          const btn = document.createElement('button');
          btn.textContent = opt;
          btn.addEventListener('click', () => sendOption(taskId, box, opt));
          box.appendChild(btn);
        }
        el.appendChild(box);
      }
    }
    return el;
  }

  // Appends only the turns past renderedTurnCounts[id] as new DOM nodes -
  // never re-renders already-appended turns, so scroll position survives a
  // poll tick. Separately keeps one dedicated "pending" node in sync with
  // the live in-progress text every tick (that one node IS replaced each
  // time, since it represents content that's still changing).
  function updateTranscript(id, container, st) {
    const finalTurns = (st && st.turns) || [];
    const already = renderedTurnCounts[id] || 0;
    if (finalTurns.length > already) {
      const wasNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 40;
      const pending = container.querySelector('.turn.assistant.pending');
      for (let i = already; i < finalTurns.length; i++) {
        const node = turnNode(finalTurns[i], id);
        if (pending) container.insertBefore(node, pending);
        else container.appendChild(node);
      }
      renderedTurnCounts[id] = finalTurns.length;
      if (wasNearBottom) container.scrollTop = container.scrollHeight;
    }

    let pending = container.querySelector('.turn.assistant.pending');
    const streamingText = st && st.streamingText;
    if (streamingText) {
      if (!pending) {
        pending = document.createElement('div');
        pending.className = 'turn assistant pending';
        container.appendChild(pending);
      }
      pending.innerHTML = renderMarkdown(streamingText);
    } else if (pending) {
      pending.remove();
    }

    // Queued-but-not-yet-sent messages (typed while Claude was busy - see
    // /reply's `busy` branch) - server truth, so just rebuild every tick
    // rather than diffing; this list is always short-lived and small.
    container.querySelectorAll('.queued-chip').forEach(el => el.remove());
    const queued = (st && st.queuedMessages) || [];
    for (const msg of queued) {
      const chip = document.createElement('div');
      chip.className = 'queued-chip';
      chip.textContent = '🕒 queued: ' + msg;
      container.appendChild(chip);
    }
  }

  // Called every 2s by the status poll. Patches only the badge, tail preview,
  // transcript, and the disabled/active state of the "Send to Claude" and
  // reply controls on already-rendered cards - never touches
  // .send-box/.reply-box textarea values, so it can't interrupt your typing.
  function updateStatuses() {
    for (const card of document.querySelectorAll('#runningList .card, #completedList .card, #list .card:not(.compact)')) {
      const id = card.dataset.id;
      const st = status[id];

      const badgeEl = card.querySelector('.status-badge');
      if (badgeEl) badgeEl.innerHTML = statusBadgeHtml(id);

      const endstateEl = card.querySelector('.endstate-container');
      if (endstateEl) endstateEl.innerHTML = endstateHtml(st);

      // Created once and updated in place (not innerHTML-replaced) so the
      // disclosure's animated open/closed state (see .tail-toggle in
      // buildCard) survives every 2s poll tick instead of resetting.
      const tailEl = card.querySelector('.tail-container');
      const tailToggleBtn = card.querySelector('.tail-toggle');
      if (tailEl && tailToggleBtn) {
        let tailBox = tailEl.querySelector('.tail');
        if (st && st.tail) {
          if (!tailBox) {
            tailBox = document.createElement('div');
            tailBox.className = 'tail';
            tailEl.appendChild(tailBox);
            if (openTailIds.has(id)) {
              createDisclosure(tailBox).open({ instant: true });
              tailToggleBtn.classList.add('open');
            }
          }
          tailBox.textContent = st.tail;
          tailToggleBtn.hidden = false;
        } else {
          tailEl.innerHTML = '';
          tailToggleBtn.hidden = true;
        }
      }

      const transcriptContainer = card.querySelector('.transcript-container');
      if (transcriptContainer) {
        let transcriptEl = transcriptContainer.querySelector('.transcript');
        const hasContent = st && ((st.turns && st.turns.length) || st.streamingText);
        if (hasContent && !transcriptEl) {
          transcriptEl = document.createElement('div');
          transcriptEl.className = 'transcript';
          transcriptContainer.appendChild(transcriptEl);
        }
        if (transcriptEl) updateTranscript(id, transcriptEl, st);
      }

      const toggleBtn = card.querySelector('.toggleSend');
      if (toggleBtn) toggleBtn.disabled = Boolean(st && (st.status === 'running' || st.status === 'completed'));

      const markDoneBtn = card.querySelector('.markDone');
      // Stays clickable when the PATCH failed - that's exactly when a retry
      // is needed.
      if (markDoneBtn) markDoneBtn.disabled = Boolean(st && st.markedDone && !st.markDoneError);

      const RESUMABLE_STATUSES = ['waiting', 'interrupted', 'failed'];
      // 'completed' (Claude hit its done marker, nobody's pressed Finish yet)
      // is just as idle/replyable as 'running' - see markFinished/server.js.
      const idle = Boolean(st && (st.status === 'running' || st.status === 'completed') && st.awaitingInput);
      const busy = Boolean(st && st.status === 'running' && !st.awaitingInput);
      const resumable = Boolean(st && RESUMABLE_STATUSES.includes(st.status) && st.hasSession && !st.markedDone);

      card.dataset.busy = busy ? '1' : '';
      syncReplyButton(card);

      const resumeBtn = card.querySelector('.resumeBtn');
      if (resumeBtn) resumeBtn.hidden = !resumable;

      // Adhoc/external cards only - see buildCard's actionsHtml.
      const finishBtn = card.querySelector('.finishBtn');
      if (finishBtn) finishBtn.hidden = !(idle || busy);

      const paymentBannerEl = card.querySelector('.payment-banner-container');
      if (paymentBannerEl) {
        paymentBannerEl.innerHTML = (st && st.paymentGateArmed && !st.paymentApproved)
          ? `<div class="payment-banner">
               <span>⚠️ Possible payment/checkout detected${st.paymentGateReason ? ' (' + escapeHtml(st.paymentGateReason) + ')' : ''} — paused for your approval.</span>
               <button class="approve-payment-btn">Approve payment</button>
             </div>`
          : '';
      }

      const textBannerEl = card.querySelector('.text-banner-container');
      if (textBannerEl) renderTextBanners(textBannerEl, id, st);

      const replyBox = card.querySelector('.reply-box');
      if (replyBox) {
        const visible = idle || busy || resumable;
        replyBox.classList.toggle('visible', visible);
        replyBox.classList.toggle('active', idle); // 'active' keeps its old meaning: highlighted, your turn
        let hint = '';
        if (busy) {
          hint = 'Claude is working — your message will be queued and sent as soon as it hands back.';
        } else if (st && st.status === 'completed') {
          hint = 'Claude reported this done — press Finish to close, or reply to keep going.';
        } else if (idle) {
          hint = st.evidenceGateFailed
            ? 'Claude claimed this task was done, but its evidence didn\'t cover the checklist above — review the transcript, then reply or mark done manually.'
            : lastTurnHasOptions(st)
              ? 'Claude is waiting - pick an option above, or reply below.'
              : (lastTurnHasActionItems(st) ? 'Claude needs input - see action items above.' : 'Your turn - Claude is waiting for a reply.');
        } else if (st && st.status === 'waiting') {
          hint = `Waiting: ${st.waitingReason || 'blocked on something external'} — reply or click Resume when ready.`;
        } else if (st && st.status === 'interrupted') {
          hint = 'Interrupted — reply or click Resume to continue.';
        } else if (st && st.status === 'failed') {
          hint = 'This run failed — reply or click Resume to try continuing the same conversation.';
        }
        replyBox.querySelector('.hint').textContent = hint;
        replyBox.querySelector('textarea').disabled = !visible;
        replyBox.querySelector('.reply-send').disabled = !visible;
      }

      // Option buttons live inside already-appended turn nodes (never
      // re-rendered - see updateTranscript's comment), so their
      // enabled/focused state has to be patched here every tick instead:
      // only the LAST turn's options should ever be clickable, and only
      // while still awaiting input - a stale options-box from a turn the
      // user already answered (or one superseded by a newer turn) must not
      // stay live.
      if (transcriptContainer) {
        const assistantEls = Array.from(transcriptContainer.querySelectorAll('.turn.assistant:not(.pending)'));
        const lastAssistantEl = assistantEls[assistantEls.length - 1];
        const lastTurn = st && st.turns && st.turns[st.turns.length - 1];
        const optionsActive = Boolean(
          st && st.status === 'running' && st.awaitingInput &&
          lastTurn && lastTurn.role === 'assistant' && lastTurn.options && lastTurn.options.length
        );
        transcriptContainer.querySelectorAll('.options-box').forEach(box => {
          const isLast = box.closest('.turn') === lastAssistantEl;
          box.querySelectorAll('button').forEach(b => { b.disabled = !(isLast && optionsActive); });
        });
        if (optionsActive && lastAssistantEl) {
          const key = id + ':' + lastTurn.ts;
          const textarea = card.querySelector('.reply-box textarea');
          const userIsTyping = document.activeElement === textarea && textarea.value.trim().length > 0;
          if (!autoFocusedOptionTurns.has(key) && !userIsTyping) {
            const firstBtn = lastAssistantEl.querySelector('.options-box button');
            if (firstBtn) firstBtn.focus();
            autoFocusedOptionTurns.add(key);
          }
        }
      }
    }
  }

  // Combines both columns' visible tasks - notes load for running cards too,
  // not just the searchable task list.
  function loadVisibleNotes() {
    // Notion-only - adhoc/external sessions have no Notion page to pull notes
    // from (see the missing .notes-container in buildCard for those kinds).
    const notionOnly = t => t.kind === 'notion';
    const others = showHistory ? getHistoryTasks() : getFilteredTasks();
    const seen = new Set();
    loadAllNotes([...getRunningTasks(), ...getCompletedTasks(), ...others]
      .filter(notionOnly).filter(t => !seen.has(t.id) && seen.add(t.id)));
  }

  // Notes are fetched *after* the list is already visible, a few tasks at a
  // time, instead of blocking the initial render on all of them (that's what
  // made a refresh take ~10s with a large backlog) or not fetching them at
  // all (which just hides the content). They stream in progressively.
  async function loadAllNotes(taskList) {
    taskList = taskList.filter(t => !notesCache[t.id]);
    if (!taskList.length) return;
    const NOTES_CONCURRENCY = 4;
    let next = 0;
    async function worker() {
      while (next < taskList.length) {
        const t = taskList[next++];
        const containers = [...document.querySelectorAll(`.card[data-id="${CSS.escape(t.id)}"] .notes-container`)];
        if (!containers.length) continue;
        try {
          const r = await fetch(`/api/tasks/${encodeURIComponent(t.id)}/notes`);
          const { notes } = await r.json();
          const html = notes && notes.length
            ? `<div class="notes"><ul>${notes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul></div>`
            : '<div class="notes">(no notes)</div>';
          notesCache[t.id] = html;
          for (const c of containers) c.innerHTML = html;
        } catch {
          for (const c of containers) c.innerHTML = '<div class="notes">failed to load notes</div>';
        }
      }
    }
    await Promise.all(Array.from({ length: Math.min(NOTES_CONCURRENCY, taskList.length) }, worker));
  }

  // Texts an agent queued (messages.js send): pending ones get Send / Reject,
  // finished ones linger for a while with their outcome. Re-rendered only when
  // something changed, so thumbnails aren't refetched on every poll tick.
  const TEXT_OUTCOME_SHOW_MS = 30 * 60 * 1000;
  function renderTextBanners(container, taskId, st) {
    const texts = ((st && st.pendingTexts) || []).filter(t =>
      t.status === 'pending' || t.status === 'sending' ||
      (t.status !== 'rejected' && Date.now() - t.requestedAt < TEXT_OUTCOME_SHOW_MS));
    const sig = JSON.stringify(texts.map(t => [t.id, t.status, t.result]));
    if (container.dataset.sig === sig) return;
    container.dataset.sig = sig;
    container.innerHTML = texts.map(t => {
      const realName = t.contactName && t.contactName !== t.displayName
        ? ` · Contacts: ${escapeHtml(t.contactName)}` : '';
      const files = t.files.map((f, n) => f.image
        ? `<img data-preview="${n}" alt="${escapeHtml(f.name)}" title="${escapeHtml(f.from)}">`
        : `<div class="file" title="${escapeHtml(f.from)}">${PAPERCLIP_SVG} ${escapeHtml(f.name)} · ${(f.size / 1024 / 1024).toFixed(1)} MB</div>`).join('');
      const actions = t.status === 'pending'
        ? `<div class="row"><button class="reject" data-req="${t.id}">Reject</button><button class="send" data-req="${t.id}">Send</button></div>`
        : `<div class="outcome">${t.status === 'sending' ? 'Sending…' : escapeHtml(t.status + (t.result && t.result !== t.status ? ': ' + t.result : ''))}</div>`;
      return `<div class="text-banner" data-text="${t.id}">
          <div class="to">💬 Text to ${escapeHtml(t.displayName)} <span class="handle">· ${escapeHtml(t.handle)} · ${escapeHtml(t.service)}${realName}</span></div>
          ${t.text ? `<div class="body">${escapeHtml(t.text)}</div>` : ''}
          ${files ? `<div class="files">${files}</div>` : ''}
          ${actions}
        </div>`;
    }).join('');
    for (const el of container.querySelectorAll('.text-banner')) {
      for (const img of el.querySelectorAll('img[data-preview]')) {
        setImgSrcUrl(img, `/api/tasks/${encodeURIComponent(taskId)}/text-preview/${encodeURIComponent(el.dataset.text)}/${img.dataset.preview}`);
      }
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Rebuilds the project dropdown's options from whatever projects are
  // present among the currently-loaded tasks (no separate canonical list to
  // keep in sync). Falls back to "All projects" if the previously-selected
  // project no longer has any open tasks.
  function populateProjectFilter() {
    const distinct = Array.from(new Set(tasks.map(t => t.project).filter(Boolean))).sort();
    const options = ['<option value="">All projects</option>',
      `<option value="${NO_PROJECT_VALUE}">No project</option>`,
      ...distinct.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`)];
    projectFilterSelect.innerHTML = options.join('');
    projectFilterSelect.value = projectFilter;
    if (projectFilterSelect.value !== projectFilter) {
      projectFilter = '';
      projectFilterSelect.value = '';
    }
  }

  // --- Day view (top-left "Day" column) ---
  const dayPrevBtn = document.getElementById('dayPrev');
  const dayNextBtn = document.getElementById('dayNext');
  const dayDateInput = document.getElementById('dayDate');
  const dayColTitle = document.querySelector('#dayCol .col-title');
  const dayAllDayEl = document.getElementById('dayAllDay');
  const dayGridEl = document.getElementById('dayGrid');
  const dayEmptyEl = document.getElementById('dayEmpty');

  const DAY_HOUR_PX = 40;

  function addDaysStr(dateStr, n) {
    const d = new Date(`${dateStr}T00:00:00`);
    d.setDate(d.getDate() + n);
    const p = v => String(v).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function formatDayLabel(dateStr) {
    const label = new Date(`${dateStr}T00:00:00`).toLocaleDateString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric',
    });
    if (dateStr === todayLocalStr()) return `Today — ${label}`;
    if (dateStr === addDaysStr(todayLocalStr(), 1)) return `Tomorrow — ${label}`;
    return label;
  }
  function minutesSinceMidnight(iso) {
    const d = new Date(iso);
    return d.getHours() * 60 + d.getMinutes();
  }
  function formatClock(iso) {
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function escapeHtmlDay(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  let dayDate = addDaysStr(todayLocalStr(), 1); // default: tomorrow

  // Repositions (or removes) just the current-time line/dot, without a full
  // re-render - called every minute so the line tracks real time between the
  // slower 5-minute data refreshes below.
  function updateNowLine() {
    let line = dayGridEl.querySelector('.day-now-line');
    let dot = dayGridEl.querySelector('.day-now-dot');
    if (dayDate !== todayLocalStr()) {
      if (line) line.remove();
      if (dot) dot.remove();
      return;
    }
    const now = new Date();
    const top = ((now.getHours() * 60 + now.getMinutes()) / 60) * DAY_HOUR_PX;
    if (!line) {
      line = document.createElement('div');
      line.className = 'day-now-line';
      dayGridEl.appendChild(line);
    }
    if (!dot) {
      dot = document.createElement('div');
      dot.className = 'day-now-dot';
      dayGridEl.appendChild(dot);
    }
    line.style.top = `${top}px`;
    dot.style.top = `${top}px`;
  }

  // Google Calendar items carry their calendar's own colours (as the GCal UI
  // shows them); everything else is coloured by its kind's CSS class.
  function dayColorStyle(item) {
    if (!item.color) return '';
    // Feeds the tinted .day-chip/.day-block style (a wash of the calendar's
    // colour plus an edge bar) - the calendar's own fg is meant for a solid
    // fill, so the text is a lightened mix of the colour instead.
    const c = escapeHtmlDay(item.color);
    return `--c:${c};--fg:color-mix(in srgb, ${c} 40%, #fff)`;
  }

  function dayChipHtml(item, cls, title) {
    const tag = item.url ? 'a' : 'span';
    const hrefAttr = item.url ? ` href="${escapeHtmlDay(item.url)}" target="_blank" rel="noopener"` : '';
    const titleAttr = title ? ` title="${escapeHtmlDay(title)}"` : '';
    const style = dayColorStyle(item);
    const styleAttr = style ? ` style="${style}"` : '';
    return `<${tag} class="day-chip ${cls}"${hrefAttr}${titleAttr}${styleAttr}>${escapeHtmlDay(item.title)}</${tag}>`;
  }

  function renderDay(data) {
    const { tasks = [], events = [], shopping = [], classes = [], gcal = [] } = data || {};
    const allDayTasks = tasks.filter(t => !t.hasTime);
    const allDayEvents = events.filter(e => !e.hasTime);
    const allDayGcal = gcal.filter(g => !g.hasTime);
    // Classes always carry a real time (parsed straight from a schedule
    // table), so there's no all-day bucket for them.
    const timed = [
      ...tasks.filter(t => t.hasTime), ...events.filter(e => e.hasTime), ...classes,
      ...gcal.filter(g => g.hasTime),
    ];

    const rows = [];
    if (allDayTasks.length || allDayEvents.length || allDayGcal.length) {
      rows.push(
        '<div class="day-alldrow">' +
        allDayTasks.map(t => dayChipHtml(t, 'task', t.project || '')).join('') +
        allDayEvents.map(e => dayChipHtml(e, 'event', e.project || '')).join('') +
        allDayGcal.map(g => dayChipHtml(g, 'gcal', g.sub || '')).join('') +
        '</div>'
      );
    }
    if (shopping.length) {
      rows.push('<div class="day-alldrow-label">Shopping</div>');
      rows.push(
        '<div class="day-alldrow">' +
        shopping.map(s => dayChipHtml(s, 'shop', '')).join('') +
        '</div>'
      );
    }
    dayAllDayEl.innerHTML = rows.join('');

    let gridHtml = '';
    for (let h = 0; h < 24; h++) {
      const label = h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`;
      gridHtml += `<div class="day-hour-row" style="top:${h * DAY_HOUR_PX}px"><span class="day-hour-label">${label}</span></div>`;
    }
    for (const item of timed) {
      const top = (minutesSinceMidnight(item.start) / 60) * DAY_HOUR_PX;
      const durMin = item.end ? (new Date(item.end) - new Date(item.start)) / 60000 : 30;
      const height = Math.max((durMin / 60) * DAY_HOUR_PX, 16);
      const cls = item.kind === 'task' ? 'task' : item.kind === 'class' ? 'class' : item.kind === 'gcal' ? 'gcal' : 'event';
      const tooltip = item.project || item.sub || '';
      const tag = item.url ? 'a' : 'div';
      const hrefAttr = item.url ? ` href="${escapeHtmlDay(item.url)}" target="_blank" rel="noopener"` : '';
      gridHtml +=
        `<${tag} class="day-block ${cls}" style="top:${top}px;height:${height}px;${dayColorStyle(item)}"${hrefAttr} title="${escapeHtmlDay(tooltip)}">` +
        `<div class="day-block-title">${escapeHtmlDay(item.title)}</div>` +
        `<div class="day-block-time">${formatClock(item.start)}${item.end ? '–' + formatClock(item.end) : ''}</div>` +
        `</${tag}>`;
    }
    dayGridEl.innerHTML = gridHtml;
    updateNowLine();

    dayEmptyEl.style.display = (tasks.length + events.length + shopping.length + classes.length + gcal.length === 0) ? 'block' : 'none';
  }

  // Stale-while-revalidate cache of /api/day responses, keyed by date. Each
  // fetch costs several live Notion queries, so switching days used to feel
  // laggy; now days within +-DAY_CACHE_RADIUS of the viewed one are prefetched
  // and a switch renders instantly from cache (revalidating in the background
  // once an entry is older than DAY_CACHE_TTL_MS).
  const DAY_CACHE_RADIUS = 7;
  const DAY_CACHE_TTL_MS = 5 * 60 * 1000;
  const DAY_PREFETCH_CONCURRENCY = 2; // Notion rate-limits ~3 req/s
  const dayCache = new Map();    // date -> { data, fetchedAt }
  const dayInflight = new Map(); // date -> Promise (dedupes click vs prefetch)

  function fetchDay(date) {
    if (dayInflight.has(date)) return dayInflight.get(date);
    const p = (async () => {
      try {
        const tz = new Date(`${date}T00:00:00`).getTimezoneOffset();
        const r = await fetch(`/api/day?date=${date}&tz=${tz}`);
        if (!r.ok) return null; // leave any cached/last-good render in place
        const data = await r.json();
        dayCache.set(date, { data, fetchedAt: Date.now() });
        return data;
      } catch {
        return null;
      } finally {
        dayInflight.delete(date);
      }
    })();
    dayInflight.set(date, p);
    return p;
  }

  function dayIsFresh(date) {
    const c = dayCache.get(date);
    return Boolean(c) && Date.now() - c.fetchedAt < DAY_CACHE_TTL_MS;
  }

  // Warms the window around the viewed day (nearest days first, a couple at a
  // time) and evicts entries that have fallen outside it.
  let prefetchRunning = false;
  async function prefetchWindow() {
    if (prefetchRunning) return;
    prefetchRunning = true;
    try {
      for (;;) {
        const center = dayDate; // re-read each pass so navigating re-centres the window
        const days = [];
        for (let i = 0; i <= DAY_CACHE_RADIUS; i++) {
          days.push(addDaysStr(center, i));
          if (i) days.push(addDaysStr(center, -i));
        }
        const keep = new Set(days);
        for (const k of [...dayCache.keys()]) if (!keep.has(k)) dayCache.delete(k);
        const todo = days.filter(d => !dayIsFresh(d) && !dayInflight.has(d));
        if (!todo.length) break;
        const batch = todo.slice(0, DAY_PREFETCH_CONCURRENCY);
        await Promise.all(batch.map(fetchDay));
        // A failed fetch leaves its date stale; stop rather than hammer Notion.
        if (batch.every(d => !dayIsFresh(d))) break;
      }
    } finally {
      prefetchRunning = false;
    }
  }

  async function loadDay({ force = false } = {}) {
    const date = dayDate;
    dayDateInput.value = date;
    if (dayColTitle) dayColTitle.textContent = formatDayLabel(date);

    const cached = dayCache.get(date);
    if (cached) renderDay(cached.data);
    if (!cached || force || !dayIsFresh(date)) {
      const data = await fetchDay(date);
      // Rapid clicking: don't paint a response for a day no longer shown.
      if (data && date === dayDate) renderDay(data);
    }
    prefetchWindow();
  }

  dayPrevBtn.addEventListener('click', () => { dayDate = addDaysStr(dayDate, -1); loadDay(); });
  dayNextBtn.addEventListener('click', () => { dayDate = addDaysStr(dayDate, 1); loadDay(); });
  dayDateInput.addEventListener('change', () => {
    if (dayDateInput.value) { dayDate = dayDateInput.value; loadDay(); }
  });

  async function loadTasks() {
    meta.textContent = 'loading...';
    errorBanner.hidden = true;
    try {
      const r = await fetch('/api/tasks');
      const data = await r.json();
      if (!r.ok) {
        if (data.rateLimited) showError(data.error);
        else meta.textContent = 'failed to load tasks';
        return;
      }
      tasks = data;
      lastTasksKey = tasksKey(data);
      notesCache = {};
      populateProjectFilter();
      meta.textContent = `refreshed ${new Date().toLocaleTimeString()}`;
      renderList();
      loadVisibleNotes();
    } catch (e) {
      meta.textContent = 'failed to load tasks';
    }
  }

  // Background re-sync with Notion so tasks checked off (or reopened) in
  // Notion itself leave/rejoin the list without a manual refresh. Same
  // diff-guard idea as loadSessions(): only a real change re-renders, and
  // notesCache is kept so notes aren't re-fetched every tick.
  let lastTasksKey = '';
  const tasksKey = list => JSON.stringify(
    list.map(t => [t.id, t.title, t.due_date, t.project]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
  );

  async function refreshTasks() {
    try {
      const r = await fetch('/api/tasks');
      if (!r.ok) return;
      const data = await r.json();
      if (!Array.isArray(data)) return;
      const key = tasksKey(data);
      if (key === lastTasksKey) return;
      lastTasksKey = key;
      tasks = data;
      populateProjectFilter();
      renderList();
      loadVisibleNotes();
    } catch {}
  }

  // Adhoc + adopted-external sessions - see allItems(). Polled on its own
  // slower interval (not the 2s status poll) since it's just a list of ids/
  // titles, not live turn data.
  // Diff-guard mirroring pollStatus()'s lastLayoutKey - only a real change
  // to the session listing should trigger a destructive renderList(); every
  // other tick just re-assigns `sessions` (cheap, keeps other reads fresh).
  let lastSessionsKey = '';

  async function loadSessions() {
    try {
      const r = await fetch('/api/sessions');
      const data = await r.json();
      if (Array.isArray(data)) {
        sessions = data;
        const sessionsKey = JSON.stringify(
          data.map(s => [s.id, s.title, s.cwd]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
        );
        if (sessionsKey !== lastSessionsKey) {
          lastSessionsKey = sessionsKey;
          renderList();
        }
      }
    } catch {}
  }

  // --- New session panel (free-standing sessions, not tied to a Notion task) ---
  const newSessionPanel = document.getElementById('newSessionPanel');
  const newSessionName = document.getElementById('newSessionName');
  const newSessionInstructions = document.getElementById('newSessionInstructions');
  const newSessionWorkdir = document.getElementById('newSessionWorkdir');
  const newSessionModel = document.getElementById('newSessionModel');
  const newSessionGo = document.getElementById('newSessionGo');
  const advancedToggle = document.getElementById('advancedToggle');
  const advancedPanel = document.getElementById('advancedPanel');

  const advancedDisclosure = createDisclosure(advancedPanel);

  // Grows the textarea with its content (up to max-height, where it scrolls
  // instead) rather than the box popping open into a separate panel - too
  // small an element for that kind of reveal to feel right.
  function autoGrowTextarea(el, maxHeight = 240) {
    function resize() {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, maxHeight) + 'px';
      el.style.overflowY = el.scrollHeight > maxHeight ? 'auto' : 'hidden';
    }
    el.addEventListener('input', resize);
    resize();
    return resize;
  }
  const resizeComposeTextarea = autoGrowTextarea(newSessionInstructions);

  function populateNewSessionModel() {
    newSessionModel.innerHTML = appConfig.models
      .map(m => `<option value="${escapeHtml(m)}"${m === appConfig.defaultModel ? ' selected' : ''}>${escapeHtml(m)}</option>`)
      .join('');
  }

  function closeNewSessionPanel() {
    advancedDisclosure.close({ instant: true });
    advancedToggle.setAttribute('aria-expanded', 'false');
    newSessionName.value = '';
    newSessionInstructions.value = '';
    newSessionWorkdir.value = '';
    resizeComposeTextarea();
    newSessionInstructions.blur();
  }

  newSessionInstructions.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeNewSessionPanel();
  });
  advancedToggle.addEventListener('click', () => {
    const willOpen = !advancedDisclosure.isOpen();
    advancedDisclosure.toggle();
    advancedToggle.setAttribute('aria-expanded', String(willOpen));
  });
  sendOnEnter(newSessionInstructions, newSessionGo);
  const newSessionAttach = attachImages(newSessionInstructions,
    document.getElementById('newSessionChips'), document.getElementById('newSessionAttach'));

  newSessionGo.addEventListener('click', async () => {
    const instructions = newSessionInstructions.value;
    if (!instructions.trim() && !newSessionAttach.has()) {
      alert('Instructions are required.');
      return;
    }
    const images = newSessionAttach.take();
    newSessionGo.disabled = true;
    try {
      const r = await fetch('/api/sessions/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: newSessionName.value,
          instructions,
          workdir: newSessionWorkdir.value,
          model: newSessionModel.value,
          images,
        }),
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'failed to start session');
      closeNewSessionPanel();
      await loadSessions();
      await pollStatus();
    } catch (e) {
      alert('Failed to start session: ' + e.message);
    } finally {
      newSessionGo.disabled = false;
    }
  });

  // --- Other Claude Code sessions (read-only, needs-your-input only) ---
  const detectedSessionsList = document.getElementById('detectedSessionsList');

  function fmtAgo(startedAt) {
    if (!startedAt) return '';
    const mins = Math.max(0, Math.floor((Date.now() - startedAt) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    return `${Math.floor(mins / 60)}h ago`;
  }

  // "Requires input" means something different per kind: an interactive
  // (terminal) session sitting idle is at the prompt waiting on you - the
  // interactive equivalent of a normal task card's awaitingInput badge. A
  // background (daemon) session only clearly needs you when it reports
  // status 'waiting' (paired with a waitingFor reason) - 'blocked' is not
  // the same thing (seen on long-dormant agents with no such reason).
  //
  // Neither signal alone is enough, though: `claude agents --json` only
  // reports when a session STARTED, so a terminal that's been sitting idle
  // for 10 minutes and one abandoned for 2 weeks look identical - and in
  // practice several "idle"/"waiting" sessions turned out to be forgotten
  // terminals from days ago, not anything actually needing attention. The
  // server backs `lastActivityAt` with each session's own transcript file's
  // mtime (see sessionLastActivity in server.js) - that's real activity, so
  // it's the actual gate; status only decides *which* real-activity
  // sessions count as "your turn" vs "Claude's turn".
  const RECENT_ACTIVITY_MS = 30 * 60 * 1000;
  function needsInput(s) {
    if (!s.lastActivityAt || Date.now() - s.lastActivityAt > RECENT_ACTIVITY_MS) return false;
    if (s.kind === 'interactive') return s.status === 'idle';
    if (s.kind === 'background') return s.status === 'waiting';
    return false;
  }

  async function loadExternalSessions() {
    try {
      const r = await fetch('/api/external-sessions');
      const data = await r.json();
      const sess = ((data && data.sessions) || []).filter(needsInput);
      detectedSessionsList.innerHTML = '';
      for (const s of sess) {
        const row = document.createElement('div');
        row.className = 'ext-row';
        row.innerHTML = `
          <div class="ext-row-main">
            <div class="ext-row-name">${escapeHtml(s.name || '(unnamed session)')}</div>
            <div class="ext-row-sub">${escapeHtml(s.cwd || '')} — ${escapeHtml(s.status || '')}${s.waitingFor ? ' (' + escapeHtml(s.waitingFor) + ')' : ''} — ${fmtAgo(s.lastActivityAt)}</div>
          </div>
        `;
        detectedSessionsList.appendChild(row);
      }
    } catch {}
  }

  // Only reordering (a card moving between the Running / Done-review /
  // History-or-neither buckets) needs a full renderList() re-sort; every
  // other poll tick just patches badges/tail/transcript in place via
  // updateStatuses() so open textareas and scroll position survive. Tracks
  // all three bucket-determining statuses, not just 'running' - a
  // completed->finished move (pressing Finish) changes which column a card
  // belongs in without ever touching 'running'.
  let lastLayoutKey = '';

  async function pollStatus() {
    try {
      const r = await fetch('/api/status');
      status = await r.json();
      const layoutKey = Object.keys(status)
        .map(id => {
          const s = status[id].status;
          return ['running', 'waiting', 'interrupted', 'failed', 'completed', 'finished'].includes(s) ? `${id}:${s}` : null;
        })
        .filter(Boolean)
        .sort()
        .join(',');
      if (layoutKey !== lastLayoutKey) {
        lastLayoutKey = layoutKey;
        renderList();
      }
      updateStatuses();
      renderOktaBanner();
    } catch {}
  }

  // Okta push approval: an agent is stuck on the U-M Okta number challenge and
  // the user (maybe on their phone) has to tap the matching number.
  const oktaBanner = document.getElementById('oktaBanner');
  const baseTitle = document.title;
  let oktaKey = '';
  let oktaTitleTimer = null;
  function renderOktaBanner() {
    const ids = Object.keys(status).filter(id => status[id].pendingOkta);
    const id = ids[0];
    const o = id && status[id].pendingOkta;
    if (!o) {
      oktaBanner.hidden = true;
      oktaKey = '';
      if (oktaTitleTimer) { clearInterval(oktaTitleTimer); oktaTitleTimer = null; document.title = baseTitle; }
      return;
    }
    const task = status[id].name || id;
    const msg = o.kind === 'failed' ? 'Okta push failed or was rejected - sign in manually in Chrome'
      : o.kind === 'password' ? 'Okta needs your password - sign in manually in Chrome'
      : 'Tap this number in Okta Verify:';
    oktaBanner.innerHTML =
      `<span>${escapeHtml(msg)}</span>` +
      (o.kind === 'push' ? `<span class="okta-num">${escapeHtml(o.number)}</span>` : '') +
      `<span class="okta-sub">${escapeHtml(task)}${o.site ? ' · ' + escapeHtml(o.site) : ''}</span>`;
    oktaBanner.hidden = false;
    const key = `${id}:${o.kind}:${o.number}:${o.ts}`;
    if (key === oktaKey) return;
    oktaKey = key;
    const label = o.kind === 'push' ? `Okta: tap ${o.number}` : 'Okta: sign in needed';
    try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch {}
    try {
      if (window.isSecureContext && 'Notification' in window) {
        if (Notification.permission === 'granted') new Notification(label, { body: task, tag: 'okta' });
        else if (Notification.permission === 'default') Notification.requestPermission();
      }
    } catch {}
    if (oktaTitleTimer) clearInterval(oktaTitleTimer);
    let flip = false;
    oktaTitleTimer = setInterval(() => { flip = !flip; document.title = flip ? label : baseTitle; }, 1000);
  }

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    renderList();
    loadVisibleNotes();
  });

  projectFilterSelect.addEventListener('change', () => {
    projectFilter = projectFilterSelect.value;
    renderList();
    loadVisibleNotes();
  });

  historyToggleBtn.addEventListener('click', () => {
    showHistory = !showHistory;
    historyToggleBtn.classList.toggle('active', showHistory);
    historyToggleBtn.textContent = showHistory ? '← Active' : 'History';
    renderList();
    loadVisibleNotes();
  });

  refreshBtn.addEventListener('click', () => {
    loadTasks();
    loadSessions();
    loadDay({ force: true });
  });
  loadConfig().then(() => {
    populateNewSessionModel();
    loadTasks();
    loadSessions();
  });
  loadExternalSessions();
  loadDay();
  pollStatus();
  setInterval(pollStatus, 2000);
  // Own slower cadence - just id/title/cwd listings, not live turn data, and
  // discovery (claude agents --json) spawns a real subprocess each call.
  setInterval(loadSessions, 10000);
  setInterval(loadExternalSessions, 15000);
  setInterval(refreshTasks, 60 * 1000);
  // Notion Tasks/Events/Shopping change far less often than running-session
  // status - no need for the 2s pollStatus cadence here.
  setInterval(() => loadDay({ force: true }), 5 * 60 * 1000);
  // Keeps the current-time line moving between those slower data refreshes.
  setInterval(updateNowLine, 60 * 1000);
</script>
</body>
</html>
