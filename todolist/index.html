<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todolist</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todolist">
<meta name="theme-color" content="#161618">
<style>
  :root {
    /* Neutrals - one ramp, layered by lightness instead of shadows. */
    --bg: #161618;
    --surface: #1c1c1f;
    --surface-2: #232327;
    --input-bg: #121214;
    --border: #2a2a2f;
    --border-strong: #3a3a41;
    --input-border: #2e2e34;
    --text: #dcddde;
    --text-mid: #b0b0b8;
    --text-muted: #8a8a92;
    --text-faint: #64646c;
    /* Old names, kept so nothing that still points at them breaks. */
    --text-muted-1: var(--text-muted);
    --text-muted-2: var(--text-faint);
    --text-muted-3: var(--text-muted);
    --text-muted-4: var(--text-mid);
    --text-muted-5: var(--text-mid);
    --btn-bg: var(--surface-2);
    --btn-hover: #2c2c31;

    /* Status hues. Every status surface is a low-alpha tint of its hue with
       the hue itself as text - quieter than the old solid fills. */
    --blue: #6b9cf0;
    --amber: #d9a94a;
    --teal: #4fb3ad;
    --green: #62b97c;
    --red: #e07070;
    --accent: #3a6bd6;
    --accent-hover: #4a7ae6;
    --tint: 14%;
    --tint-hover: 22%;

    --danger-bg: color-mix(in srgb, var(--red) var(--tint), transparent);
    --danger-hover: color-mix(in srgb, var(--red) var(--tint-hover), transparent);
    --danger-text: #f0a8a8;
    --warn-bg: color-mix(in srgb, var(--amber) var(--tint), transparent);
    --warn-hover: color-mix(in srgb, var(--amber) var(--tint-hover), transparent);
    --warn-text: #ecc97e;
    --teal-bg: color-mix(in srgb, var(--teal) var(--tint), transparent);
    --teal-hover: color-mix(in srgb, var(--teal) var(--tint-hover), transparent);
    --teal-text: #8fd8d2;
    --success-bg: color-mix(in srgb, var(--green) var(--tint), transparent);
    --success-text: #9edcb0;
    --info-bg: color-mix(in srgb, var(--blue) var(--tint), transparent);
    --info-text: #a9c4f5;
    --overdue: var(--red);
    --overdue-text: var(--red);
    --task-bg: var(--warn-bg);
    --task-text: var(--warn-text);
    --event-bg: var(--teal-bg);
    --event-text: var(--teal-text);
    --shop-bg: var(--info-bg);
    --shop-text: var(--info-text);

    --radius-lg: 8px;
    --radius-md: 6px;
    --radius-sm: 6px;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    /* Motion: a no-overshoot spring baked into a CSS linear() curve (the
       motion.dev AI Kit technique), for hover/press feedback in plain CSS.
       JS-driven animation uses Motion's own spring, see createDisclosure. */
    --spring: linear(0, 0.034, 0.128 4.1%, 0.415 9.6%, 0.689 15.6%, 0.86 21.6%,
                     0.948 27.6%, 0.99 34%, 1.008 41%, 1.01 48%, 1.003 62%, 1);
    --spring-dur: 0.35s;
    --fast: 0.12s ease-out;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

  #wrap { max-width: 1600px; margin: 0 auto; padding: 32px 20px 80px; }
  #columns { display: flex; gap: 28px; align-items: flex-start; }
  #dayCol { flex: 1 1 0; min-width: 300px; }
  #runningCol { flex: 2 1 0; min-width: 380px; }
  #taskCol { flex: 1 1 0; min-width: 300px; }
  /* Wide layout: the task sidebar is pinned to the viewport and scrolls on
     its own (search row fixed on top), instead of running the page long. */
  @media (min-width: 1351px) {
    #taskCol {
      position: sticky; top: 16px; max-height: calc(100vh - var(--task-top, 16px) - 16px);
      display: flex; flex-direction: column;
    }
    #searchRow { flex-shrink: 0; }
    #list, #empty { overflow-y: auto; min-height: 0; }
    #list { flex: 1; margin-right: -8px; padding-right: 8px; overscroll-behavior: contain; }
  }
  @media (max-width: 1350px) {
    #columns { flex-direction: column; }
    #dayCol, #runningCol, #taskCol { flex-basis: auto; width: 100%; min-width: 0; }
  }

  /* --- Shared form controls --- */
  input, textarea, select {
    transition: border-color var(--fast), background var(--fast);
  }
  #dayDate, #searchInput, #projectFilter, #tokenDialog input,
  .send-box textarea, .send-box input, .reply-box textarea,
  .new-session-panel input, .new-session-panel textarea, .new-session-panel select {
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--radius-md);
    color: var(--text); font: inherit; font-size: 15px; padding: 8px 10px; color-scheme: dark;
  }
  #dayDate:hover, #searchInput:hover, #projectFilter:hover,
  .send-box textarea:hover, .send-box input:hover, .reply-box textarea:hover,
  .new-session-panel input:hover, .new-session-panel select:hover { border-color: var(--border-strong); }
  ::placeholder { color: var(--text-faint); }

  /* --- Day view (top-left column) --- */
  #dayNav { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  #dayNav button { padding: 5px 11px; }
  #dayDate { flex: 1; min-width: 0; padding: 5px 8px; }
  #dayLegend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 10px; font-size: 12px; color: var(--text-muted); }
  #dayLegend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .legend-dot.task { background: var(--amber); }
  .legend-dot.event { background: var(--teal); }
  .legend-dot.class { background: var(--green); }
  .legend-dot.shop { background: var(--blue); }
  .legend-dot.gcal { background: #4285f4; }
  #dayAllDay:not(:empty) { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .day-alldrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-alldrow-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
  .day-chip {
    font-size: 13px; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--fg);
    box-shadow: inset 2px 0 0 var(--c);
    transition: background var(--fast);
  }
  .day-block, .day-chip { color: inherit; text-decoration: none; }
  a.day-block { display: block; cursor: pointer; }
  a.day-chip { cursor: pointer; }
  a.day-chip:hover { background: color-mix(in srgb, var(--c) 26%, transparent); }
  .day-chip.task, .day-block.task { --c: var(--amber); --fg: var(--warn-text); }
  .day-chip.event, .day-block.event { --c: var(--teal); --fg: var(--teal-text); }
  .day-chip.shop { --c: var(--blue); --fg: var(--info-text); }
  .day-block.class { --c: var(--green); --fg: var(--success-text); }
  /* Fallback only - GCal items normally carry their calendar's own colour
     inline (as --c, see dayColorStyle). */
  .day-chip.gcal, .day-block.gcal { --c: #4285f4; --fg: #dbe6fd; }
  #dayGridWrap {
    position: relative; height: 460px; overflow-y: auto; overflow-x: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--input-bg);
  }
  #dayGrid { position: relative; height: calc(24 * 44px); }
  .day-hour-row { position: absolute; left: 0; right: 0; height: 44px; border-top: 1px solid #1e1e22; }
  .day-hour-label {
    position: absolute; left: 4px; top: -8px; font-size: 11px; color: var(--text-faint);
    background: var(--input-bg); padding: 0 3px; font-variant-numeric: tabular-nums;
  }
  .day-block {
    position: absolute; left: 42px; right: 4px; border-radius: 4px; padding: 2px 7px;
    font-size: 12px; overflow: hidden; line-height: 1.25;
    background: color-mix(in srgb, var(--c) 18%, var(--input-bg)); color: var(--fg);
    box-shadow: inset 2px 0 0 var(--c);
    transition: background var(--fast);
  }
  a.day-block:hover { background: color-mix(in srgb, var(--c) 28%, var(--input-bg)); }
  .day-block-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day-block-time { font-size: 11px; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .day-now-line { position: absolute; left: 42px; right: 4px; height: 1px; background: var(--red); z-index: 2; }
  .day-now-dot {
    position: absolute; left: 39px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--red); margin-top: -3px; z-index: 2;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 20%, transparent);
  }
  #dayEmpty { color: var(--text-faint); text-align: center; padding: 20px 0; font-size: 13px; }
  .col-title {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .col-empty { color: var(--text-faint); text-align: center; padding: 32px 0; font-size: 14px; }
  header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  header > div { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  #meta { color: var(--text-faint); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* --- Buttons --- */
  button {
    font: inherit; font-size: 14px; line-height: 1.3; cursor: pointer;
    border: 1px solid var(--border-strong); border-radius: var(--radius-md);
    padding: 6px 12px; background: var(--btn-bg); color: var(--text); white-space: nowrap;
    transition: background var(--fast), border-color var(--fast), color var(--fast),
                transform var(--spring-dur) var(--spring);
  }
  button:hover { background: var(--btn-hover); border-color: #46464e; }
  button:active:not(:disabled) { transform: scale(0.97); transition-duration: 0.08s; }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.danger { background: var(--danger-bg); color: var(--danger-text); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
  button.danger:hover { background: var(--danger-hover); }
  button.warn { background: var(--warn-bg); color: var(--warn-text); border-color: color-mix(in srgb, var(--amber) 30%, transparent); }
  button.warn:hover { background: var(--warn-hover); }
  button.resumeBtn { background: var(--teal-bg); color: var(--teal-text); border-color: color-mix(in srgb, var(--teal) 30%, transparent); }
  button.resumeBtn:hover { background: var(--teal-hover); }
  .model-select {
    font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--input-border);
    border-radius: var(--radius-md); padding: 5px 8px; background: var(--input-bg); color: var(--text-muted);
    color-scheme: dark;
  }
  .model-select:hover { border-color: var(--border-strong); color: var(--text-mid); }

  input:focus-visible, textarea:focus-visible, select:focus-visible,
  button:focus-visible {
    outline: none; border-color: var(--accent);
  }
  button:focus-visible { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }

  /* --- Cards --- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 16px; margin-bottom: 10px;
    transition: border-color var(--fast);
  }
  .card:hover { border-color: var(--border-strong); }
  .card.overdue { box-shadow: inset 2px 0 0 var(--overdue); }
  .card-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
  .card-top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  /* Sidebar entry for a task whose live session is shown in the middle column. */
  .card.compact { padding: 10px 14px; }
  .card.compact .endstate-container, .card.compact .tail-toggle, .card.compact .tail-container,
  .card.compact .transcript-container, .card.compact .reply-box, .card.compact .actions,
  .card.compact .send-box, .card.compact .payment-banner-container, .card.compact .text-banner-container { display: none; }
  .markDoneCheckbox {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    cursor: pointer;
    margin: 0;
    border: 1.5px solid #4e4e57;
    border-radius: 4px;
    background: var(--input-bg);
    position: relative;
    transition: background var(--fast), border-color var(--fast), transform var(--spring-dur) var(--spring);
  }
  .markDoneCheckbox:hover:not(:disabled) { border-color: var(--text-muted); }
  .markDoneCheckbox:active:not(:disabled) { transform: scale(0.88); }
  .markDoneCheckbox:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .markDoneCheckbox:checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .markDoneCheckbox:disabled {
    cursor: default;
    opacity: 0.85;
  }
  .title { font-weight: 600; font-size: 17px; line-height: 1.35; }
  .due { font-size: 13px; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .due.overdue { color: var(--overdue-text); }
  .sub { margin-top: 4px; font-size: 13px; color: var(--text-muted); }
  .notes { margin-top: 10px; font-size: 14px; color: var(--text-mid); }
  .notes ul { padding-left: 18px; margin-top: 4px; }
  .notes li { margin: 2px 0; overflow-wrap: anywhere; }
  .notes li::marker { color: var(--text-faint); }

  .endstate-box { margin-top: 10px; font-size: 14px; }
  .endstate-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 4px; }
  .endstate-box ul { list-style: none; padding-left: 0; }
  .endstate-box li { margin: 3px 0; color: var(--text-mid); }
  .endstate-evidence { color: var(--text-muted); font-size: 13px; }
  .endstate-warn {
    margin-top: 6px; font-size: 13px; color: var(--warn-text); background: var(--warn-bg);
    border-radius: var(--radius-md); padding: 6px 8px;
  }

  .badge {
    display: inline-block; font-size: 12px; font-weight: 500;
    padding: 1px 7px; border-radius: 4px; margin-left: 8px; vertical-align: middle;
    border: 1px solid transparent;
  }
  .badge.running {
    background: var(--info-bg); color: var(--info-text);
    border-color: color-mix(in srgb, var(--blue) 25%, transparent);
  }
  .badge.running::before {
    content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--blue); margin-right: 5px; vertical-align: 1px;
    animation: badge-pulse 1.6s ease-in-out infinite;
  }
  @keyframes badge-pulse { 50% { opacity: 0.3; } }
  .badge.finished { background: var(--success-bg); color: var(--success-text); }
  .badge.failed { background: var(--danger-bg); color: var(--danger-text); }

  .tail-toggle[hidden] { display: none; }
  .tail-toggle {
    font-size: 12px; color: var(--text-muted); background: none; border: none; padding: 2px 0;
    margin-top: 8px; display: inline-flex; align-items: center; gap: 4px;
  }
  .tail-toggle:hover { background: none; color: var(--text); }
  .tail-toggle .chev { display: inline-block; transition: transform var(--spring-dur) var(--spring); }
  .tail-toggle.open .chev { transform: rotate(90deg); }
  .tail {
    overflow: hidden; height: 0; opacity: 0;
    margin-top: 0; font-family: var(--mono);
    font-size: 12px; color: var(--text-muted); white-space: pre-wrap; word-break: break-word;
    background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-md);
  }
  .tail.open { height: auto; opacity: 1; margin-top: 6px; padding: 8px 10px; max-height: 160px; overflow-y: auto; }

  .badge.interrupted { background: var(--warn-bg); color: var(--warn-text); }
  .badge.waiting { background: var(--teal-bg); color: var(--teal-text); }
  /* Claude says done, nobody's pressed Finish yet - needs the same "your
     attention" treatment as interrupted/waiting, not a quiet neutral badge. */
  .badge.completed {
    background: var(--warn-bg); color: var(--warn-text);
    border-color: color-mix(in srgb, var(--amber) 30%, transparent);
  }
  /* A run ending is not a task completing - green (.finished) is reserved for
     "actually Done in Notion", everything else stays neutral. */
  .badge.ended { background: var(--surface-2); color: var(--text-muted); border-color: var(--border); }
  .badge.cost { background: none; color: var(--text-muted); border-color: var(--border); font-variant-numeric: tabular-nums; }

  .payment-banner {
    background: var(--danger-bg); border: 1px solid color-mix(in srgb, var(--red) 35%, transparent); color: var(--danger-text);
    border-radius: var(--radius-md); padding: 10px 14px; margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 13px;
  }
  .payment-banner button { flex-shrink: 0; background: var(--danger-text); color: #3a1414; border-color: transparent; }
  .payment-banner button:hover { background: #ffd0d0; }

  /* A text an agent queued (messages.js send) - nothing goes out until Send. */
  .text-banner {
    background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); color: var(--warn-text);
    border-radius: var(--radius-md); padding: 10px 14px; margin-top: 10px; font-size: 13px;
  }
  .text-banner .to { font-weight: 700; }
  .text-banner .to .handle { font-weight: 400; opacity: 0.8; }
  .text-banner .body {
    white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; padding: 8px 10px;
    background: rgba(0, 0, 0, 0.25); border-radius: var(--radius-sm);
  }
  .text-banner .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .text-banner .files img { max-width: 160px; max-height: 160px; border-radius: var(--radius-sm); display: block; }
  .text-banner .files .file { padding: 6px 8px; background: rgba(0, 0, 0, 0.25); border-radius: var(--radius-sm); overflow-wrap: anywhere; }
  .text-banner .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .text-banner .row button.send { background: var(--warn-text); color: #2e240c; border-color: transparent; }
  .text-banner .row button.send:hover { background: #f6dca2; }
  .text-banner .outcome { margin-top: 6px; opacity: 0.9; }

  .queued-chip {
    align-self: flex-end; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--info-text);
    border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: var(--radius-md); padding: 7px 10px; font-size: 14px; max-width: 92%;
    white-space: pre-wrap; font-style: italic; opacity: 0.75;
  }

  /* --- Transcript --- */
  .transcript {
    margin-top: 10px; display: flex; flex-direction: column; gap: 8px;
    max-height: 320px; overflow-y: auto; padding: 4px 2px;
  }
  .turn { border-radius: var(--radius-md); padding: 7px 11px; font-size: 14px; max-width: 92%; }
  .turn.user {
    align-self: flex-end; background: color-mix(in srgb, var(--accent) 24%, var(--surface));
    color: #e2eafb; white-space: pre-wrap;
  }
  .turn.assistant { align-self: flex-start; background: var(--input-bg); border: 1px solid var(--border); }
  .turn.assistant.pending { opacity: 0.7; border-style: dashed; }
  .turn.assistant :first-child { margin-top: 0; }
  .turn.assistant :last-child { margin-bottom: 0; }
  .turn.assistant p, .turn.assistant ul, .turn.assistant ol { margin: 6px 0; padding-left: 20px; }
  .turn.assistant pre { background: var(--surface); border: 1px solid var(--border); padding: 8px 10px; border-radius: var(--radius-md); overflow-x: auto; }
  .turn.assistant code { font-family: var(--mono); font-size: 12px; }
  .turn.assistant :not(pre) > code { background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
  .turn.assistant a { color: var(--info-text); }
  .turn.assistant pre.action-box {
    background: color-mix(in srgb, var(--green) 10%, var(--input-bg));
    border: 1px solid color-mix(in srgb, var(--green) 30%, transparent); color: var(--success-text);
    font-family: var(--mono); font-size: 12px;
    margin: 0 0 8px; padding: 8px 10px;
  }
  .turn.assistant .options-box { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .turn.assistant .options-box button { font-size: 12px; padding: 4px 10px; }
  .turn.assistant .options-box button:first-child { background: var(--accent); border-color: transparent; color: #fff; }
  .turn.assistant .options-box button:first-child:hover { background: var(--accent-hover); }

  .send-box { margin-top: 12px; overflow: hidden; height: 0; opacity: 0; }
  .send-box.open { height: auto; opacity: 1; }
  .attach-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .attach-chips:empty { display: none; }
  .attach-chip { position: relative; }
  .attach-chip img { height: 56px; border-radius: var(--radius-md); display: block; border: 1px solid var(--border); }
  .attach-chip button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border-radius: 50%; line-height: 1; font-size: 12px; }
  .icon {
    width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.125em;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* --- Composer (Claude Cowork layout): one rounded box, text on top, a
     toolbar inside it below - attach/folder on the left, model + send on the
     right. Used by the new-session panel, each card's reply box and each
     Notion card's send-box. --- */
  .composer {
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px;
    padding: 10px 10px 8px 12px; cursor: text;
    transition: border-color var(--fast);
  }
  .composer:hover { border-color: var(--border-strong); }
  .composer:focus-within { border-color: #4a4a52; }
  .composer .composer-input, .composer .composer-input:hover, .composer .composer-input:focus-visible {
    display: block; width: 100%; background: none; border: none; outline: none; padding: 0; margin: 0;
    resize: none; font-size: 15px; min-height: 44px; max-height: 240px; overflow-y: hidden;
  }
  .composer .attach-chips { margin: 8px 0 0; }
  .composer-bar { display: flex; align-items: center; gap: 4px; margin-top: 8px; cursor: default; }
  .composer-bar .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .composer-bar [hidden] { display: none !important; }
  .composer .ghost-btn, .composer .send-btn, .composer .stop-btn {
    width: 30px; height: 30px; padding: 0; flex-shrink: 0; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .composer .ghost-btn { background: none; border-color: transparent; color: var(--text-muted); }
  .composer .ghost-btn:hover { background: var(--surface-2); color: var(--text); }
  .composer .ghost-btn .icon { width: 17px; height: 17px; }
  .composer .send-btn { background: var(--accent); border-color: transparent; color: #fff; }
  .composer .send-btn:hover { background: var(--accent-hover); }
  .composer .send-btn .icon { width: 16px; height: 16px; stroke-width: 2.4; }
  .composer .stop-btn { background: var(--text); border-color: transparent; color: var(--bg); }
  .composer .stop-btn:hover { background: #fff; }
  .composer .stop-btn .icon { width: 12px; height: 12px; fill: currentColor; stroke: none; }
  /* Working-directory picker: a quiet chip like Cowork's folder selector. */
  .composer .folder {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; min-width: 0;
    border-radius: 8px; color: var(--text-muted); transition: background var(--fast);
  }
  .composer .folder:hover, .composer .folder:focus-within { background: var(--surface-2); }
  .composer .folder .icon { width: 15px; height: 15px; }
  .composer .folder .folder-input, .composer .folder .folder-input:hover {
    background: none; border: none; outline: none; padding: 0; margin: 0;
    width: 210px; min-width: 0; font-size: 13px; color: var(--text-mid);
  }
  .composer .model-select, .composer .model-select:hover {
    width: auto; margin: 0; padding: 4px 6px; border-color: transparent; background: none;
    font-size: 13px; color: var(--text-muted);
  }
  .composer .model-select:hover { background: var(--surface-2); color: var(--text); }
  .drag-over { outline: 1px dashed var(--accent); outline-offset: 2px; }
  .turn-images { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .turn-images img { max-height: 140px; max-width: 100%; border-radius: var(--radius-md); cursor: zoom-in; }
  .reply-box { margin-top: 12px; display: none; }
  .reply-box.visible { display: block; }
  .reply-box .hint { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .reply-box.visible.active .hint { color: var(--info-text); font-weight: 600; }
  .reply-box.visible.active .composer { border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
  .reply-box:not(.active) .composer-input { opacity: 0.6; }
  .actions { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
  .actions-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  #empty { color: var(--text-faint); text-align: center; padding: 40px 0; font-size: 14px; }
  #searchRow { margin-bottom: 16px; display: flex; gap: 8px; }
  #searchInput { flex: 1; min-width: 0; }
  #projectFilter { cursor: pointer; }
  #historyToggle.active { background: var(--teal-bg); color: var(--teal-text); border-color: color-mix(in srgb, var(--teal) 35%, transparent); }
  .error-banner {
    background: var(--danger-bg); color: var(--danger-text); border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
    border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
  }

  .okta-banner {
    position: sticky; top: 0; z-index: 50; background: var(--red); color: #fff;
    border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 15px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }
  .okta-banner[hidden] { display: none; }
  .okta-banner .okta-num { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: 1px; }
  .okta-banner .okta-sub { font-size: 12px; opacity: 0.85; }

  #tokenDialog {
    background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg); padding: 18px 20px; width: min(360px, 90vw);
    margin: auto; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
  }
  #tokenDialog::backdrop { background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(2px); }
  #tokenDialog h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  #tokenDialog input { width: 100%; }
  #tokenDialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  /* --- New-session composer --- */
  /* The panel is itself a .composer; its textarea grows with its content
     (see autoGrowTextarea) instead of popping a separate panel open. */
  .new-session-panel { margin-bottom: 20px; padding: 12px 12px 8px 14px; }
  .new-session-panel .composer-input { font-size: 17px; min-height: 26px; transition: height 0.15s ease; }
  .new-session-panel label { font-size: 11px; color: var(--text-muted); display: block; }
  .new-session-panel .advanced-panel input { width: 100%; margin-top: 4px; }
  .new-session-panel .advanced-inner { padding: 8px 2px 4px; }

  .advanced-toggle {
    font-size: 12px; color: var(--text-muted); background: none; border: none; padding: 0 8px; height: 30px;
    display: inline-flex; align-items: center; gap: 4px; border-radius: 8px;
  }
  .advanced-toggle:hover { background: var(--surface-2); color: var(--text); }
  .advanced-toggle .chev { display: inline-block; transition: transform var(--spring-dur) var(--spring); }
  .advanced-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .advanced-panel { overflow: hidden; height: 0; opacity: 0; }
  .advanced-panel.open { height: auto; opacity: 1; }

  .ext-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 6px; font-size: 14px;
  }
  .ext-row-main { flex: 1; min-width: 0; }
  .ext-row-name { font-weight: 600; }
  .ext-row-sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  #detectedSessionsList:not(:empty) { margin-bottom: 14px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Todolist</h1>
    <div>
      <span id="meta"></span>
      <button id="refreshBtn">Refresh</button>
    </div>
  </header>
  <div id="errorBanner" class="error-banner" hidden></div>
  <div id="oktaBanner" class="okta-banner" hidden></div>
  <div id="newSessionPanel" class="new-session-panel composer">
    <textarea id="newSessionInstructions" class="composer-input" rows="1" placeholder="What should Claude do? (paste or attach images)"></textarea>
    <div id="newSessionChips" class="attach-chips"></div>
    <div class="composer-bar">
      <button id="newSessionAttach" class="ghost-btn" type="button" title="Attach image" aria-label="Attach image"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="folder" title="Working directory - leave blank to let Claude find it itself"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><input id="newSessionWorkdir" class="folder-input" type="text" placeholder="Any folder" aria-label="Working directory"></span>
      <button id="advancedToggle" class="advanced-toggle" type="button" aria-expanded="false">
        <span class="chev">▸</span> Advanced
      </button>
      <div class="end">
        <select id="newSessionModel" class="model-select" title="Model" aria-label="Model"></select>
        <button id="newSessionGo" class="send-btn" type="button" title="Start session (Enter)" aria-label="Start session"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
    <div id="advancedPanel" class="advanced-panel">
      <div class="advanced-inner">
        <label for="newSessionName">Name (optional)</label>
        <input id="newSessionName" type="text" placeholder="What is this session for?">
      </div>
    </div>
  </div>
  <div id="columns">
    <div id="dayCol">
      <div class="col-title">Day</div>
      <div id="dayNav">
        <button id="dayPrev" type="button">‹</button>
        <input id="dayDate" type="date">
        <button id="dayNext" type="button">›</button>
      </div>
      <div id="dayLegend">
        <span><i class="legend-dot task"></i>Tasks</span>
        <span><i class="legend-dot event"></i>Events</span>
        <span><i class="legend-dot class"></i>Classes</span>
        <span><i class="legend-dot shop"></i>Shopping</span>
        <span><i class="legend-dot gcal"></i>Google</span>
      </div>
      <div id="dayAllDay"></div>
      <div id="dayGridWrap"><div id="dayGrid"></div></div>
      <div id="dayEmpty" style="display:none">Nothing scheduled.</div>
    </div>
    <div id="runningCol">
      <div class="col-title">Running</div>
      <div id="detectedSessionsList"></div>
      <div id="runningList"></div>
      <div id="runningEmpty" class="col-empty" style="display:none">No running tasks.</div>
      <div class="col-title" style="margin-top:16px">Done — review</div>
      <div id="completedList"></div>
      <div id="completedEmpty" class="col-empty" style="display:none">Nothing waiting on Finish.</div>
    </div>
    <div id="taskCol">
      <div id="searchRow">
        <input id="searchInput" type="text" placeholder="Search tasks...">
        <select id="projectFilter"><option value="">All projects</option></select>
        <button id="historyToggle" type="button">History</button>
      </div>
      <div id="list"></div>
      <div id="empty" style="display:none">No open tasks.</div>
    </div>
  </div>
</div>

<dialog id="tokenDialog">
  <h2>Todolist access token</h2>
  <input id="tokenInput" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Paste or type token">
  <div class="row">
    <button id="tokenCancel" type="button">Cancel</button>
    <button id="tokenSubmit" class="primary" type="button">Save</button>
  </div>
</dialog>

<script src="/vendor/marked.min.js"></script>
<script type="module">
  // Loaded from a CDN (no build step in this app) - accepted as a hard
  // dependency since this is a personal, always-online local dashboard.
  import { animate, stagger } from "https://cdn.jsdelivr.net/npm/motion@13.4.0/+esm";

  // Auth bootstrap: attaches the shared-secret token to every /api/* fetch,
  // so this page works the same from localhost (no token configured yet) and
  // from the Tailscale address (token required). Wraps window.fetch once,
  // before any of the fetch-calling functions below run, since every call
  // site already uses same-origin relative /api/... URLs.
  (() => {
    const TOKEN_KEY = 'todolistToken';
    const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
    // A themed <dialog> instead of window.prompt(): iOS Safari applies its
    // default autocapitalize/autocorrect to a native prompt()'s text field
    // with no way for the page to turn that off, silently mangling a typed
    // token's first letter (or more) before it's ever sent - the server
    // then rejects it and the user sees an endless re-prompt loop with no
    // clue why. A real <input> lets us set autocapitalize/autocorrect/
    // spellcheck="off" so what's typed is what gets sent.
    const dialog = document.getElementById('tokenDialog');
    const tokenInput = document.getElementById('tokenInput');
    const tokenSubmit = document.getElementById('tokenSubmit');
    const tokenCancel = document.getElementById('tokenCancel');
    // Serializes concurrent 401s onto ONE dialog. The page fires several
    // fetches on load (config, tasks, sessions, external-sessions, status)
    // - without this, every one of them that hits a 401 at the same time
    // would independently try to open the dialog. Concurrent callers share
    // the same in-flight prompt and its result instead.
    let pendingPrompt = null;
    const promptForToken = () => {
      if (!pendingPrompt) {
        pendingPrompt = new Promise((resolve) => {
          tokenInput.value = '';
          dialog.showModal();
          setTimeout(() => tokenInput.focus(), 0);
          const finish = (value) => {
            dialog.close();
            tokenSubmit.removeEventListener('click', onSubmit);
            tokenCancel.removeEventListener('click', onCancel);
            tokenInput.removeEventListener('keydown', onKeydown);
            const t = (value || '').trim();
            if (t) localStorage.setItem(TOKEN_KEY, t);
            pendingPrompt = null;
            resolve(t);
          };
          const onSubmit = () => finish(tokenInput.value);
          const onCancel = () => finish('');
          const onKeydown = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); finish(tokenInput.value); }
          };
          tokenSubmit.addEventListener('click', onSubmit);
          tokenCancel.addEventListener('click', onCancel);
          tokenInput.addEventListener('keydown', onKeydown);
        });
      }
      return pendingPrompt;
    };
    if (!getToken()) promptForToken();

    const realFetch = window.fetch.bind(window);
    window.fetch = async (input, init = {}) => {
      const headers = new Headers(init.headers || {});
      const token = getToken();
      if (token) headers.set('Authorization', `Bearer ${token}`);
      let res = await realFetch(input, { ...init, headers });
      if (res.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        const t = await promptForToken();
        if (t) {
          headers.set('Authorization', `Bearer ${t}`);
          res = await realFetch(input, { ...init, headers });
        }
      }
      return res;
    };
  })();

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const runningList = document.getElementById('runningList');
  const runningEmpty = document.getElementById('runningEmpty');
  const completedList = document.getElementById('completedList');
  const completedEmpty = document.getElementById('completedEmpty');
  const meta = document.getElementById('meta');
  const refreshBtn = document.getElementById('refreshBtn');
  const errorBanner = document.getElementById('errorBanner');
  const searchInput = document.getElementById('searchInput');
  const projectFilterSelect = document.getElementById('projectFilter');
  const historyToggleBtn = document.getElementById('historyToggle');

  // The sticky task sidebar fills exactly the visible space below its top
  // edge: below the header/composer at page top, growing to full height as
  // the page scrolls and it pins (CSS reads --task-top, see #taskCol).
  const taskCol = document.getElementById('taskCol');
  function fitTaskCol() {
    taskCol.style.setProperty('--task-top', Math.max(16, taskCol.getBoundingClientRect().top) + 'px');
  }
  let fitQueued = false;
  addEventListener('scroll', () => {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(() => { fitQueued = false; fitTaskCol(); });
  }, { passive: true });
  addEventListener('resize', fitTaskCol);
  // Things above the columns that change height (the growing composer, the
  // error banner) move the sidebar's top without any scroll.
  new ResizeObserver(fitTaskCol).observe(document.querySelector('header'));
  new ResizeObserver(fitTaskCol).observe(document.getElementById('newSessionPanel'));
  new ResizeObserver(fitTaskCol).observe(errorBanner);

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.hidden = false;
  }

  let tasks = [];
  // Adhoc/external sessions from /api/sessions, already shaped like a task
  // item ({id, kind, title, cwd}) - see loadSessions(). Notion tasks (from
  // /api/tasks) get `kind: 'notion'` added on the fly in allItems() below,
  // since /api/tasks itself has no reason to know about session kinds.
  let sessions = [];
  let status = {};
  let searchQuery = '';
  // Toggles #list between the active/filtered view and the finished-runs
  // History view - see getHistoryTasks()/getFilteredTasks().
  let showHistory = false;
  const NO_PROJECT_VALUE = '__NO_PROJECT__'; // sentinel; can't collide with a real project label
  let projectFilter = ''; // '' = all, NO_PROJECT_VALUE = no-project only, else exact project label
  let notesCache = {};
  let openSendBoxIds = new Set();
  let openTailIds = new Set();
  // Unsent draft text in a card's reply-box/send-box, keyed by task id - a
  // renderList() rebuild destroys and recreates every textarea/input, so this
  // is captured just before the wipe and restored onto the new nodes just
  // after (see captureDrafts/restoreDrafts), same convention as
  // openSendBoxIds/openTailIds for other DOM state that must survive a rebuild.
  let draftValues = {};
  // Ids rendered by the previous renderList() pass - lets the entrance
  // animation (see renderList) fire only for genuinely new cards, not ones
  // that were already visible and are just being rebuilt alongside a sibling.
  let previousRenderedIds = new Set();
  // Fallback mirrors config.js's defaults so cards render sensibly even if
  // /api/config hasn't resolved yet (or fails) - loadConfig() below replaces
  // this with the server's actual values.
  let appConfig = {
    defaultModel: 'claude-sonnet-5',
    models: ['claude-opus-5', 'claude-sonnet-5', 'claude-haiku-4-5-20251001'],
  };

  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      const data = await r.json();
      if (data && Array.isArray(data.models) && data.models.length) appConfig = data;
    } catch {}
  }
  // `${taskId}:${turnTs}` keys for option-turns already given the one-time
  // autofocus - so a pollStatus() re-render (every 2s) doesn't keep stealing
  // focus back from the reply textarea once the user starts typing there.
  let autoFocusedOptionTurns = new Set();
  // How many of a card's status.turns are already appended to its
  // .transcript-container - lets updateStatuses() append only new turns
  // instead of re-rendering the whole transcript (which would lose scroll
  // position), mirroring how the tail box already avoids full re-renders.
  let renderedTurnCounts = {};

  // A session that is live-but-not-actively-executing (waiting on something
  // external, interrupted by a server restart, crashed) is still an open,
  // resumable session, so it belongs in the Running column too.
  function isRunning(id) {
    return Boolean(status[id] && ['running', 'waiting', 'interrupted', 'failed'].includes(status[id].status));
  }

  // Model hit its own done marker, but no human has pressed Finish/mark-done
  // yet - see markFinished/server.js. Still a live, replyable session.
  function isCompleted(id) {
    return Boolean(status[id] && status[id].status === 'completed');
  }

  // Only ever true after an explicit Finish click / mark-done checkbox.
  function isHistorical(id) {
    return Boolean(status[id] && status[id].status === 'finished');
  }

  // Every card-worthy item, Notion task or not - adhoc/external sessions
  // (from /api/sessions) tag along with the Notion tasks (from /api/tasks,
  // implicitly `kind: 'notion'`) so both feed the same running/filtered
  // lists and buildCard().
  function allItems() {
    return tasks.map(t => ({ ...t, kind: 'notion' })).concat(sessions);
  }

  // Tasks with a live session also appear (as compact cards, see buildCard)
  // in the middle Running / Done-review columns, but stay here as plain
  // entries until marked done. Finished tasks live in History
  // (see getHistoryTasks()) instead of this searchable active list.
  function getFilteredTasks() {
    const q = searchQuery.trim().toLowerCase();
    let filtered = allItems();
    if (q) filtered = filtered.filter(t => (t.title || '').toLowerCase().includes(q));
    if (projectFilter === NO_PROJECT_VALUE) {
      filtered = filtered.filter(t => !t.project);
    } else if (projectFilter) {
      filtered = filtered.filter(t => t.project === projectFilter);
    }
    // Notion tasks: /api/tasks already returns exactly the open ones, so
    // Notion is the only thing deciding whether they're listed. A locally
    // 'finished' session (the Finish button never touches Notion) must not
    // hide a task that's still open there. Only adhoc/external sessions,
    // which have no Notion state, fall back to the local status.
    return filtered.filter(t => t.kind === 'notion' || !isHistorical(t.id));
  }

  // Always every running task, unaffected by search/project filter - the
  // Running column is meant to be an always-visible "what's executing now"
  // panel, not a subset of the searchable task list.
  function getRunningTasks() {
    return allItems().filter(t => isRunning(t.id));
  }

  // Same always-visible treatment as Running, for tasks Claude says are done
  // but nobody's confirmed yet - this is what keeps a just-finished run from
  // getting buried at the bottom of a long task list.
  function getCompletedTasks() {
    return allItems().filter(t => isCompleted(t.id));
  }

  // Finished runs, newest-first. `completedAt` only exists on entries
  // finished after this feature shipped - older ones (finished under the old
  // auto-finish behavior) fall back to `startedAt` and sort after.
  function getHistoryTasks() {
    const key = t => (status[t.id] && (status[t.id].completedAt || status[t.id].startedAt)) || 0;
    return allItems().filter(t => isHistorical(t.id)).sort((a, b) => key(b) - key(a));
  }

  // Images in <img> can't carry the auth header, so fetch through the
  // patched window.fetch and hand the element a blob URL.
  async function setImgSrc(img, name) {
    return setImgSrcUrl(img, '/api/uploads/' + encodeURIComponent(name));
  }
  async function setImgSrcUrl(img, url) {
    try {
      const r = await fetch(url);
      if (r.ok) img.src = URL.createObjectURL(await r.blob());
    } catch {}
  }

  // Line icons. PLUS/FOLDER/ARROW_UP also appear inline in the static
  // new-session markup.
  const svgIcon = (body) => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
  const PAPERCLIP_SVG = svgIcon('<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>');
  const PLUS_SVG = svgIcon('<path d="M12 5v14M5 12h14"/>');
  const ARROW_UP_SVG = svgIcon('<path d="M12 19V5M5 12l7-7 7 7"/>');
  const STOP_SVG = svgIcon('<rect x="4" y="4" width="16" height="16" rx="3"/>');
  const FOLDER_SVG = svgIcon('<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>');

  // Clicking a composer's padding (not one of its controls) focuses its text,
  // the way the whole box is the click target in Claude's own composer.
  document.addEventListener('click', (e) => {
    const box = e.target.closest('.composer');
    if (box && (e.target === box || e.target.classList.contains('attach-chips'))) {
      box.querySelector('.composer-input')?.focus();
    }
  });

  // Paste / drop / attach-button image attach for a textarea. Uploads immediately and
  // shows removable thumbnails in `chips`. Returns { take() } which yields the
  // uploaded file names and clears the chips.
  function attachImages(textarea, chips, attachBtn) {
    const names = [];
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.multiple = true; input.hidden = true;
    async function add(file) {
      if (!file || !file.type.startsWith('image/')) return;
      try {
        const r = await fetch('/api/uploads', { method: 'POST', headers: { 'Content-Type': file.type }, body: file });
        const data = await r.json();
        if (!data.ok) throw new Error(data.error || 'upload failed');
        names.push(data.name);
        const chip = document.createElement('div');
        chip.className = 'attach-chip';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        const x = document.createElement('button');
        x.type = 'button'; x.textContent = '×';
        x.addEventListener('click', () => { names.splice(names.indexOf(data.name), 1); chip.remove(); });
        chip.append(img, x);
        chips.appendChild(chip);
      } catch (e) { alert('Image upload failed: ' + e.message); }
    }
    textarea.addEventListener('paste', (e) => {
      const files = [...(e.clipboardData ? e.clipboardData.items : [])]
        .filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile());
      if (files.length) { e.preventDefault(); files.forEach(add); }
    });
    textarea.addEventListener('dragover', (e) => { e.preventDefault(); textarea.classList.add('drag-over'); });
    textarea.addEventListener('dragleave', () => textarea.classList.remove('drag-over'));
    textarea.addEventListener('drop', (e) => {
      e.preventDefault(); textarea.classList.remove('drag-over');
      [...e.dataTransfer.files].forEach(add);
    });
    attachBtn.addEventListener('click', () => input.click());
    input.addEventListener('change', () => { [...input.files].forEach(add); input.value = ''; });
    return {
      has: () => names.length > 0,
      take() { const out = names.slice(); names.length = 0; chips.innerHTML = ''; return out; },
    };
  }

  function sendOnEnter(textarea, triggerBtn) {
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!triggerBtn.disabled) triggerBtn.click();
      }
    });
  }

  // One shared expand/collapse primitive (motion.dev's animate()) for every
  // disclosure in this app - the new-session panel, its Advanced sub-panel,
  // and each card's send-box. `openClass` is the same convention the CSS
  // already used pre-Motion (.open), kept as the source of truth for
  // "is this open" so state-restoration (see openSendBoxIds/openTailIds)
  // doesn't need a second bookkeeping mechanism.
  // Springs rather than a fixed-duration tween: a re-toggle mid-flight keeps
  // its velocity instead of restarting the curve. bounce 0 - a height
  // overshoot would visibly jiggle the content below.
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPRING = { type: 'spring', visualDuration: 0.28, bounce: 0 };
  function createDisclosure(el, { openClass = 'open', slide = true } = {}) {
    const closedY = slide ? 6 : 0;
    // animate() is always called BEFORE the class flips - Motion reads the
    // element's real current style as its animation start point for
    // height/opacity, and if the class (which drives those via CSS) already
    // flipped first, "current" would already equal the target and nothing
    // would visibly animate. No busy/in-flight guard: Motion interrupts a
    // still-running animation on the same element cleanly, so a rapid
    // re-toggle (or one that resumes after a backgrounded tab pauses it)
    // just redirects smoothly instead of getting permanently stuck.
    function open({ instant = reduceMotion } = {}) {
      if (el.classList.contains(openClass)) return;
      if (instant) {
        el.classList.add(openClass);
        el.style.height = 'auto';
        el.style.opacity = 1;
        el.style.transform = '';
        return;
      }
      animate(el, { height: 'auto', opacity: 1, y: [closedY, 0] }, SPRING)
        .finished.then(() => { el.style.transform = ''; }).catch(() => {});
      el.classList.add(openClass);
    }
    function close({ instant = reduceMotion } = {}) {
      if (!el.classList.contains(openClass)) return;
      if (instant) {
        el.classList.remove(openClass);
        el.style.height = '';
        el.style.opacity = '';
        el.style.transform = '';
        return;
      }
      animate(el, { height: 0, opacity: 0, y: [0, closedY] }, SPRING)
        .finished.then(() => {
          el.style.height = '';
          el.style.opacity = '';
          el.style.transform = '';
        }).catch(() => {});
      el.classList.remove(openClass);
    }
    function isOpen() { return el.classList.contains(openClass); }
    function toggle(opts) { (isOpen() ? close : open)(opts); }
    return { open, close, toggle, isOpen };
  }

  function todayLocalStr() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function formatDue(due) {
    if (!due) return 'no due date';
    if (/^\d{4}-\d{2}-\d{2}$/.test(due)) {
      const [y, m, d] = due.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    const dt = new Date(due);
    if (isNaN(dt)) return due;
    const sameYear = dt.getFullYear() === new Date().getFullYear();
    return dt.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      ...(sameYear ? {} : { year: 'numeric' }),
      hour: 'numeric', minute: '2-digit',
    });
  }

  function fmtElapsed(startedAt) {
    const s = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  function lastTurnHasActionItems(st) {
    const turns = st && st.turns;
    if (!turns || !turns.length) return false;
    const last = turns[turns.length - 1];
    return Boolean(last.role === 'assistant' && last.actionItems && last.actionItems.length);
  }

  function lastTurnHasOptions(st) {
    const turns = st && st.turns;
    if (!turns || !turns.length) return false;
    const last = turns[turns.length - 1];
    return Boolean(last.role === 'assistant' && last.options && last.options.length);
  }

  // Static per-task checklist (not per-turn, unlike action-items/options), so
  // it lives near the top of the card and is patched every poll tick like the
  // badge - a human glancing at a card they haven't watched run can see what
  // was promised (bullets) vs what's been checked off (evidence, once any
  // done-evidence turn has landed).
  function endstateHtml(st) {
    if (!st || !st.endstate || !st.endstate.length) return '';
    const evidence = st.lastDoneEvidence || [];
    const items = st.endstate.map((item, i) => {
      const ev = evidence[i];
      const mark = st.markedDone || ev ? '✅' : '⬜';
      const evText = ev ? ` — <span class="endstate-evidence">${escapeHtml(ev)}</span>` : '';
      return `<li>${mark} ${escapeHtml(item)}${evText}</li>`;
    }).join('');
    const warn = st.evidenceGateFailed
      ? `<div class="endstate-warn">Claude claimed this task was done, but its evidence didn't cover every item above after a few tries - needs a look.</div>`
      : '';
    return `<div class="endstate-box"><div class="endstate-title">Target end state</div><ul>${items}</ul>${warn}</div>`;
  }

  // Two independent things, deliberately never conflated: whether the CHAT
  // SESSION ended (st.status) and whether the TASK is done in Notion
  // (st.markedDone). Only the latter is allowed to look green - every card in
  // this list is Done=false in Notion by definition (that's the query), so a
  // green "finished" on a session that merely ended was always a lie.
  function statusBadgeHtml(id) {
    const st = status[id];
    if (!st) return '';
    const doneBadge = st.markedDone ? `<span class="badge finished">✓ done in Notion</span>` : '';
    const errBadge = st.markDoneError
      ? `<span class="badge failed" title="${escapeHtml(st.markDoneError)}">Notion mark-done failed</span>`
      : '';
    const gateBadge = st.evidenceGateFailed
      ? `<span class="badge failed" title="Claude said done but its evidence didn't cover every checklist item">evidence mismatch — needs review</span>`
      : '';
    let runBadge = '';
    if (st.status === 'running') {
      const waitingLabel = lastTurnHasOptions(st)
        ? 'needs input - pick an option below'
        : (lastTurnHasActionItems(st) ? 'needs input - see action items' : 'your turn - reply below');
      runBadge = st.awaitingInput
        ? `<span class="badge running">${waitingLabel} (${fmtElapsed(st.startedAt)})</span>`
        : `<span class="badge running">Claude is working... (${fmtElapsed(st.startedAt)})</span>`;
    } else if (st.status === 'completed') {
      runBadge = `<span class="badge completed">✓ Claude reported done — press Finish to close</span>`;
    } else if (st.status === 'finished') {
      runBadge = st.sessionEndedByUser
        ? `<span class="badge ended">session closed (marked done)</span>`
        : `<span class="badge ended">session ended - Claude reported done</span>`;
    } else if (st.status === 'failed') {
      runBadge = `<span class="badge failed">failed${st.exitCode != null ? ' (' + st.exitCode + ')' : ''} — reply or Resume to continue</span>`;
    } else if (st.status === 'interrupted') {
      runBadge = `<span class="badge interrupted">interrupted (server restarted mid-run) — reply or Resume</span>`;
    } else if (st.status === 'waiting') {
      runBadge = `<span class="badge waiting" title="${escapeHtml(st.waitingReason || '')}">⏳ waiting: ${escapeHtml(st.waitingReason || 'blocked on something external')}</span>`;
    }
    // Running total for the whole conversation (claude -p's total_cost_usd).
    const costBadge = typeof st.costUsd === 'number'
      ? `<span class="badge cost" title="API cost of this session so far">$${st.costUsd.toFixed(2)}</span>`
      : '';
    return runBadge + doneBadge + errBadge + gateBadge + costBadge;
  }

  // Builds one task card, including all of its event listeners. Shared by
  // both columns (Running / task list) in renderList() below - a card
  // renders identically regardless of which column it ends up in.
  // Notion tasks drive their session lifecycle through /api/tasks/:id/... (start,
  // mark-done, notes - all Notion-specific); adhoc/external sessions have none
  // of that, they're already running by the time a card exists for them, so
  // they use the generic /api/sessions/:id/... family instead - both accept
  // any id, this just keeps each card's calls semantically matched to its kind.
  function apiBase(t) {
    return t.kind === 'notion' ? '/api/tasks' : '/api/sessions';
  }

  function buildCard(t, { compact = false } = {}) {
      const isNotion = t.kind === 'notion';
      const overdue = isNotion && t.due_date && t.due_date < todayLocalStr();
      const card = document.createElement('div');
      card.className = 'card' + (overdue ? ' overdue' : '') + (compact ? ' compact' : '');
      card.dataset.id = t.id;

      const st = status[t.id];
      // True while a session is live-or-unclosed: covers 'running' (obviously)
      // and 'completed' (Claude's done, but the human hasn't pressed Finish/
      // mark-done yet) - starting a fresh run over either would silently
      // discard the still-open conversation. Also doubles as "show the Finish
      // button" for adhoc/external cards (see actionsHtml below).
      const sendDisabled = st && (st.status === 'running' || st.status === 'completed');
      const sendOpen = openSendBoxIds.has(t.id);
      const notesHtml = notesCache[t.id] || '<div class="notes">loading notes...</div>';

      const topLeftHtml = isNotion
        ? `<input type="checkbox" class="markDoneCheckbox">
           <div class="title">${escapeHtml(t.title)} <span class="status-badge">${compact ? '' : statusBadgeHtml(t.id)}</span></div>`
        : `<div class="title">${escapeHtml(t.title || '(untitled session)')} <span class="status-badge">${statusBadgeHtml(t.id)}</span></div>`;
      const dueHtml = isNotion ? `<div class="due ${overdue ? 'overdue' : ''}">${formatDue(t.due_date)}</div>` : '';
      const subHtml = isNotion
        ? `<div class="sub">${t.project ? 'project: ' + escapeHtml(t.project) : 'no project'}</div>`
        : `<div class="sub">${escapeHtml(t.cwd || '')}${t.kind === 'external' ? ' — adopted session' : ' — free-standing session'}</div>`;
      const notesContainerHtml = isNotion ? `<div class="notes-container">${notesHtml}</div>` : '';
      const adoptedNoteHtml = st && st.adoptedNote ? `<div class="sub">${escapeHtml(st.adoptedNote)}</div>` : '';
      // Notion cards start a task from here (toggleSend/model-select/send-box);
      // adhoc/external sessions are already running by the time a card exists
      // for them (started via the New Session panel, or adopted), so they have
      // no Notion Done checkbox to end their session through. Every card gets a
      // Finish button (/finish): it ends the session only and never touches
      // Notion - the Done checkbox stays the only thing that marks a task done.
      const actionsHtml = isNotion
        ? `<div class="actions">
             <button class="toggleSend" ${sendDisabled ? 'disabled' : ''}>Send to Claude</button>
             <div class="actions-end">
               <button class="resumeBtn" hidden>Resume</button>
               <button class="finishBtn danger" ${sendDisabled ? '' : 'hidden'}>Finish</button>
             </div>
           </div>`
        : `<div class="actions">
             <div class="actions-end">
               <button class="resumeBtn" hidden>Resume</button>
               <button class="finishBtn danger" ${sendDisabled ? '' : 'hidden'}>Finish</button>
             </div>
           </div>`;
      const sendBoxHtml = isNotion
        ? `<div class="send-box">
             <div class="composer">
               <textarea class="composer-input" placeholder="Anything extra for Claude to know? (optional)"></textarea>
               <div class="composer-bar">
                 <span class="folder" title="Working directory - leave blank to let Claude find it itself">${FOLDER_SVG}<input class="folder-input" type="text" placeholder="Any folder" aria-label="Working directory"></span>
                 <div class="end">
                   <select class="model-select" title="Model for this run" aria-label="Model">
                     ${appConfig.models.map(m => `<option value="${escapeHtml(m)}"${m === appConfig.defaultModel ? ' selected' : ''}>${escapeHtml(m)}</option>`).join('')}
                   </select>
                   <button class="go send-btn" type="button" title="Start (Enter)" aria-label="Start">${ARROW_UP_SVG}</button>
                 </div>
               </div>
             </div>
           </div>`
        : '';

      card.innerHTML = `
        <div class="card-top">
          <div class="card-top-left">
            ${topLeftHtml}
          </div>
          ${dueHtml}
        </div>
        <div class="payment-banner-container"></div>
        <div class="text-banner-container"></div>
        ${subHtml}
        ${adoptedNoteHtml}
        ${notesContainerHtml}
        <div class="endstate-container">${endstateHtml(status[t.id])}</div>
        <button class="tail-toggle" type="button" hidden><span class="chev">▸</span> log</button>
        <div class="tail-container"></div>
        <div class="transcript-container"></div>
        <div class="reply-box">
          <div class="hint"></div>
          <div class="composer">
            <textarea class="composer-input" placeholder="Reply to Claude... (paste or attach images)"></textarea>
            <div class="attach-chips"></div>
            <div class="composer-bar">
              <button class="reply-attach ghost-btn" type="button" title="Attach image" aria-label="Attach image">${PLUS_SVG}</button>
              <div class="end">
                <button class="interruptBtn stop-btn" type="button" hidden title="Stop - interrupt Claude" aria-label="Stop">${STOP_SVG}</button>
                <button class="reply-send send-btn" type="button" title="Send (Enter)" aria-label="Send">${ARROW_UP_SVG}</button>
              </div>
            </div>
          </div>
        </div>
        ${actionsHtml}
        ${sendBoxHtml}
      `;

      const sendBoxEl = card.querySelector('.send-box');
      const sendDisclosure = sendBoxEl ? createDisclosure(sendBoxEl) : null;
      // Restore already-open state instantly (no replay animation) since this
      // only happens on a renderList() rebuild, not a user click - mirrors the
      // openSendBoxIds Set which already tracked this pre-Motion.
      if (sendDisclosure && sendOpen) sendDisclosure.open({ instant: true });
      const toggleSendBtn = card.querySelector('.toggleSend');
      if (toggleSendBtn) {
        toggleSendBtn.addEventListener('click', () => {
          const willOpen = !sendDisclosure.isOpen();
          sendDisclosure.toggle();
          if (willOpen) openSendBoxIds.add(t.id);
          else openSendBoxIds.delete(t.id);
        });
      }
      // No Cancel button (Cowork-style composer): Escape closes the send-box,
      // as does the "Send to Claude" toggle; Enter starts (sendOnEnter below).
      const sendBoxTextarea = card.querySelector('.send-box textarea');
      if (sendBoxTextarea) {
        autoGrowTextarea(sendBoxTextarea);
        sendBoxTextarea.addEventListener('keydown', (e) => {
          if (e.key !== 'Escape') return;
          sendDisclosure.close();
          openSendBoxIds.delete(t.id);
        });
      }
      const tailToggleBtn = card.querySelector('.tail-toggle');
      if (tailToggleBtn) {
        tailToggleBtn.addEventListener('click', () => {
          const tailBox = card.querySelector('.tail-container .tail');
          if (!tailBox) return;
          const disc = createDisclosure(tailBox);
          const willOpen = !disc.isOpen();
          disc.toggle();
          tailToggleBtn.classList.toggle('open', willOpen);
          if (willOpen) openTailIds.add(t.id);
          else openTailIds.delete(t.id);
        });
      }
      const goBtn = card.querySelector('.go');
      if (goBtn) {
        goBtn.addEventListener('click', async () => {
          const instructions = card.querySelector('.send-box textarea').value;
          const workdir = card.querySelector('.send-box input').value;
          const model = card.querySelector('.model-select').value;
          goBtn.disabled = true;
          try {
            const r = await fetch(`/api/tasks/${encodeURIComponent(t.id)}/start`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ instructions, workdir, model }),
            });
            const data = await r.json();
            if (!data.ok) throw new Error(data.error || 'failed to start');
            sendDisclosure.close();
            openSendBoxIds.delete(t.id);
            // Fresh run - previous run's transcript (if any) no longer
            // applies, so both the DOM and the "already rendered" bookkeeping
            // must reset or new turns starting from index 0 would look like
            // they're already rendered.
            card.querySelector('.transcript-container').innerHTML = '';
            renderedTurnCounts[t.id] = 0;
            await pollStatus();
          } catch (e) {
            alert('Failed to start: ' + e.message);
          } finally {
            goBtn.disabled = false;
          }
        });
      }

      const markDoneCb = card.querySelector('.markDoneCheckbox');
      if (markDoneCb) {
        markDoneCb.addEventListener('click', async (e) => {
          const cb = e.currentTarget;
          cb.disabled = true;
          try {
            const r = await fetch(`/api/tasks/${encodeURIComponent(t.id)}/mark-done`, { method: 'POST' });
            const data = await r.json();
            if (!data.ok) throw new Error(data.error || 'failed to mark done');
            // Notion's Done PATCH succeeded - drop it now rather than wait
            // for the next refreshTasks() to see it gone from /api/tasks.
            tasks = tasks.filter(x => x.id !== t.id);
            lastTasksKey = tasksKey(tasks);
            await pollStatus();
            renderList();
          } catch (e) {
            alert('Failed to mark done: ' + e.message);
            cb.checked = false;
            cb.disabled = false;
          }
        });
      }

      card.querySelector('.interruptBtn').addEventListener('click', async () => {
        const btn = card.querySelector('.interruptBtn');
        btn.disabled = true;
        try {
          const r = await fetch(`${apiBase(t)}/${encodeURIComponent(t.id)}/interrupt`, { method: 'POST' });
          const data = await r.json();
          if (!data.ok) throw new Error(data.error || 'failed to interrupt');
          await pollStatus();
        } catch (e) {
          alert('Failed to interrupt: ' + e.message);
        } finally {
          btn.disabled = false;
        }
      });

      const finishBtn = card.querySelector('.finishBtn');
      if (finishBtn) {
        finishBtn.addEventListener('click', async () => {
          finishBtn.disabled = true;
          try {
            const r = await fetch(`${apiBase(t)}/${encodeURIComponent(t.id)}/finish`, { method: 'POST' });
            const data = await r.json();
            if (!data.ok) throw new Error(data.error || 'failed to finish');
            await pollStatus();
          } catch (e) {
            alert('Failed to finish: ' + e.message);
            finishBtn.disabled = false;
          }
        });
      }

      card.querySelector('.resumeBtn').addEventListener('click', async () => {
        const btn = card.querySelector('.resumeBtn');
        btn.disabled = true;
        try {
          const r = await fetch(`${apiBase(t)}/${encodeURIComponent(t.id)}/reply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'Resume: continue where you left off.' }),
          });
          const data = await r.json();
          if (!data.ok) throw new Error(data.error || 'failed to resume');
          await pollStatus();
        } catch (e) {
          alert('Failed to resume: ' + e.message);
        } finally {
          btn.disabled = false;
        }
      });

      // Delegated (not attached to the button directly) since the payment
      // banner's inner markup is fully replaced every poll tick by
      // updateStatuses() - a directly-attached listener would be lost the
      // moment the banner re-renders while still armed.
      card.addEventListener('click', async (e) => {
        const btn = e.target.closest('.approve-payment-btn');
        if (!btn) return;
        btn.disabled = true;
        try {
          const r = await fetch(`/api/tasks/${encodeURIComponent(t.id)}/payment-approve`, { method: 'POST' });
          const data = await r.json();
          if (!data.ok) throw new Error(data.error || 'failed to approve');
          await pollStatus();
        } catch (err) {
          alert('Failed to approve: ' + err.message);
          btn.disabled = false;
        }
      });

      // Send / Reject on a queued text - delegated for the same reason.
      card.addEventListener('click', async (e) => {
        const btn = e.target.closest('.text-banner button[data-req]');
        if (!btn) return;
        const action = btn.classList.contains('send') ? 'approve' : 'reject';
        btn.closest('.row').querySelectorAll('button').forEach(b => { b.disabled = true; });
        try {
          const r = await fetch(`/api/tasks/${encodeURIComponent(t.id)}/text-${action}/${encodeURIComponent(btn.dataset.req)}`, { method: 'POST' });
          const data = await r.json();
          if (!data.ok) throw new Error(data.error || 'failed');
          await pollStatus();
        } catch (err) {
          alert(`Failed to ${action === 'approve' ? 'send' : 'reject'}: ` + err.message);
          btn.closest('.row').querySelectorAll('button').forEach(b => { b.disabled = false; });
        }
      });

      sendOnEnter(card.querySelector('.reply-box textarea'), card.querySelector('.reply-send'));
      if (goBtn) sendOnEnter(card.querySelector('.send-box textarea'), goBtn);

      const replyAttach = attachImages(card.querySelector('.reply-box textarea'),
        card.querySelector('.reply-box .attach-chips'), card.querySelector('.reply-attach'));
      card.querySelector('.reply-send').addEventListener('click', async () => {
        const textarea = card.querySelector('.reply-box textarea');
        const message = textarea.value;
        if (!message.trim() && !replyAttach.has()) return;
        const images = replyAttach.take();
        const sendBtn = card.querySelector('.reply-send');
        sendBtn.disabled = true;
        try {
          const r = await fetch(`${apiBase(t)}/${encodeURIComponent(t.id)}/reply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, images }),
          });
          const data = await r.json();
          if (!data.ok) throw new Error(data.error || 'failed to send reply');
          textarea.value = '';
          textarea.dispatchEvent(new Event('input'));
          await pollStatus();
        } catch (e) {
          alert('Failed to send: ' + e.message);
        } finally {
          sendBtn.disabled = false;
          syncReplyButton(card);
        }
      });

      const replyTextarea = card.querySelector('.reply-box textarea');
      autoGrowTextarea(replyTextarea);
      replyTextarea.addEventListener('input', () => syncReplyButton(card));
      // Attaching/removing an image changes the chips, not the text.
      new MutationObserver(() => syncReplyButton(card))
        .observe(card.querySelector('.reply-box .attach-chips'), { childList: true });

      return card;
  }

  // Claude's composer swap: while Claude is working and there's nothing typed,
  // the send button is a stop button (interrupt); typing turns it back into
  // send, which queues the message. `card.dataset.busy` is set by the status
  // updater.
  function syncReplyButton(card) {
    const box = card.querySelector('.reply-box');
    if (!box) return;
    const empty = !box.querySelector('textarea').value.trim()
      && !box.querySelector('.attach-chips').children.length;
    const showStop = card.dataset.busy === '1' && empty;
    box.querySelector('.interruptBtn').hidden = !showStop;
    box.querySelector('.reply-send').hidden = showStop;
  }

  // Captures any unsent .reply-box/.send-box text from the currently-visible
  // cards into draftValues, keyed by task id, before renderList() wipes them.
  // Deletes an id's entry once its draft goes empty so an intentionally
  // cleared/sent draft doesn't get replayed onto a later rebuild.
  function captureDrafts() {
    for (const card of [...runningList.children, ...completedList.children, ...list.children]) {
      const id = card.dataset.id;
      if (!id || card.classList.contains('compact')) continue;
      const reply = card.querySelector('.reply-box textarea');
      const sendText = card.querySelector('.send-box textarea');
      const sendWorkdir = card.querySelector('.send-box input[type="text"]');
      const draft = {};
      if (reply && reply.value) draft.reply = reply.value;
      if (sendText && sendText.value) draft.sendText = sendText.value;
      if (sendWorkdir && sendWorkdir.value) draft.sendWorkdir = sendWorkdir.value;
      if (Object.keys(draft).length) draftValues[id] = draft;
      else delete draftValues[id];
    }
  }

  // Restores draftValues captured by captureDrafts() onto the freshly-built
  // cards after a renderList() rebuild.
  function restoreDrafts() {
    for (const card of [...runningList.children, ...completedList.children, ...list.children]) {
      const draft = draftValues[card.dataset.id];
      if (!draft || card.classList.contains('compact')) continue;
      if (draft.reply) {
        const reply = card.querySelector('.reply-box textarea');
        // 'input' so the composer re-grows and re-picks stop vs send.
        if (reply) { reply.value = draft.reply; reply.dispatchEvent(new Event('input')); }
      }
      if (draft.sendText) {
        const sendText = card.querySelector('.send-box textarea');
        if (sendText) { sendText.value = draft.sendText; sendText.dispatchEvent(new Event('input')); }
      }
      if (draft.sendWorkdir) {
        const sendWorkdir = card.querySelector('.send-box input[type="text"]');
        if (sendWorkdir) sendWorkdir.value = draft.sendWorkdir;
      }
    }
  }

  // Rebuild the visible cards from the current running/completed/filtered (or
  // history) task lists. Runs on initial load / manual Refresh, on every
  // search keystroke, from the status poll whenever a card's column
  // membership changes (see pollStatus/lastLayoutKey), and from the sessions
  // poll whenever the session listing changes (see loadSessions/lastSessionsKey) - the
  // notesCache and openSendBoxIds bookkeeping in buildCard() exists so a
  // re-render doesn't re-flash "loading notes..." or collapse an open
  // send-box on a card that stays visible. captureDrafts()/restoreDrafts()
  // similarly carry forward any unsent reply-box/send-box text across the
  // rebuild instead of losing it.
  function renderList() {
    // Rebuilding the card DOM wipes any already-appended transcript nodes,
    // so the "how much is already rendered" bookkeeping must reset with it -
    // the next status poll (already running on its own timer) repopulates
    // each transcript from scratch, same as the tail box does today.
    renderedTurnCounts = {};
    captureDrafts();

    const running = getRunningTasks();
    runningList.innerHTML = '';
    for (const t of running) runningList.appendChild(buildCard(t));
    runningEmpty.style.display = running.length ? 'none' : 'block';

    const completed = getCompletedTasks();
    completedList.innerHTML = '';
    for (const t of completed) completedList.appendChild(buildCard(t));
    completedEmpty.style.display = completed.length ? 'none' : 'block';

    const others = showHistory ? getHistoryTasks() : getFilteredTasks();
    list.innerHTML = '';
    for (const t of others) list.appendChild(buildCard(t, { compact: isRunning(t.id) || isCompleted(t.id) }));
    empty.style.display = others.length ? 'none' : 'block';
    empty.textContent = showHistory
      ? 'No finished runs yet.'
      : (allItems().length ? 'No tasks match your filters.' : 'No open tasks.');

    restoreDrafts();

    // Entrance animation only for cards whose id wasn't in the previous
    // render pass - a card that's merely being rebuilt alongside a new
    // sibling (e.g. another task started running) must not replay it.
    const currentIds = new Set([...running, ...completed, ...others].map(t => t.id));
    const newCardEls = [...runningList.children, ...completedList.children, ...list.children]
      .filter(el => !previousRenderedIds.has(el.dataset.id) && !el.classList.contains('compact'));
    if (newCardEls.length && !reduceMotion) {
      animate(newCardEls, { opacity: [0, 1], y: [8, 0] },
        { type: 'spring', visualDuration: 0.32, bounce: 0.12, delay: stagger(0.035) });
    }
    previousRenderedIds = currentIds;
  }

  function renderMarkdown(text) {
    try {
      return marked.parse(text || '');
    } catch {
      return escapeHtml(text || '');
    }
  }

  function buildActionBox(items) {
    const header = 'YOUR ACTION ITEMS';
    const lines = items.map(i => `- ${i}`);
    const width = Math.max(header.length, ...lines.map(l => l.length)) + 2;
    const bar = '+' + '-'.repeat(width) + '+';
    const pad = s => '|' + s.padEnd(width) + '|';
    return [bar, pad(' ' + header), bar, ...lines.map(l => pad(' ' + l)), bar].join('\n');
  }

  // Sends one quick-reply option exactly like a typed reply - same endpoint,
  // same body shape - just skipping the textarea. `box` is the specific
  // .options-box being clicked from, so only ITS buttons get the immediate
  // disable-on-click (a stale options-box from an earlier turn is handled
  // separately, by the every-tick gating in updateStatuses()).
  async function sendOption(taskId, box, message) {
    box.querySelectorAll('button').forEach(b => { b.disabled = true; });
    try {
      const r = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/reply`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'failed to send reply');
